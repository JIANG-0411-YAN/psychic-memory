const state = {acc:true, ys:false, nomale:true, nomember:true, nocet6:false};
const fDep = document.getElementById('fDep');
DEPS.forEach(d=>{const o=document.createElement('option');o.value=d;o.textContent=d;fDep.appendChild(o);});

function render(){
  const prov=document.getElementById('fProv').value;
  const dep=fDep.value;
  const q=document.getElementById('q').value.trim();
  let list=DATA.filter(r=>{
    if(prov && r.p!==prov) return false;
    if(dep && r.dep!==dep) return false;
    if(state.acc && !r.acc) return false;
    if(state.ys && !r.ys) return false;
    if(state.nomale && r.male) return false;
    if(state.nomember && r.pol==='中共党员') return false;
    if(state.nocet6 && r.cet6) return false;
    if(q && !((r.pos+r.loc+r.maj+r.org+r.dep).includes(q))) return false;
    return true;
  });
  document.getElementById('c1').textContent=list.length;
  document.getElementById('c2').textContent=list.reduce((a,b)=>a+b.n,0);
  document.getElementById('c3').textContent=DATA.filter(r=>(!prov||r.p===prov)&&r.acc).length;
  document.getElementById('c4').textContent=DATA.filter(r=>(!prov||r.p===prov)&&r.ys).length;
  const html=list.map((r,i)=>{
    const tags=[];
    if(r.acc) tags.push('<span class="tag acc">专业匹配</span>');
    if(r.ys) tags.push('<span class="tag ys">限应届</span>');
    if(r.male) tags.push('<span class="tag no">限男性</span>');
    if(r.cet6) tags.push('<span class="tag no">要六级</span>');
    if(r.cet4) tags.push('<span class="tag">要四级</span>');
    tags.push('<span class="tag">'+r.edu+'</span>');
    tags.push('<span class="tag">'+r.pol+'</span>');
    return `<div class="row" data-i="${DATA.indexOf(r)}">
      <div class="t"><div class="pos">${r.pos}</div><div class="n">${r.n}人</div></div>
      <div class="meta">${r.dep} · ${r.org} · ${r.loc} · 职位代码 ${r.code}</div>
      <div class="maj">专业：${r.maj}</div>
      <div class="tags">${tags.join('')}</div>
      <span class="more">备注 / 条件</span>
      <div class="bz">${r.bz}</div>
    </div>`;
  }).join('');
  document.getElementById('list').innerHTML = html || '<div class="empty">没有符合条件的岗位，换个筛选项试试</div>';
}
document.querySelectorAll('.chip').forEach(c=>{
  c.onclick=()=>{const k=c.dataset.k;state[k]=!state[k];c.classList.toggle('on',state[k]);render();};
});
['fProv','fDep'].forEach(id=>document.getElementById(id).onchange=render);
document.getElementById('q').oninput=render;
document.getElementById('list').addEventListener('click',e=>{
  if(e.target.classList.contains('more')) e.target.closest('.row').classList.toggle('open');
});
render();
