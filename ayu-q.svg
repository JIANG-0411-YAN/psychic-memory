  <path d="M63 112 q-6 22 2 34 q7 -14 6 -34 z" fill="#3B414B"/>
  <path d="M177 112 q6 22 -2 34 q-7 -14 -6 -34 z" fill="#3B414B"/>

  <!-- 脸 -->
  <path d="M66 108 C66 78 90 62 120 62 C150 62 174 78 174 108 C174 140 152 164 120 164 C88 164 66 140 66 108 Z" fill="#F7DFCE"/>

  <!-- 刘海（压住额头） -->
  <path d="M64 106 C62 70 86 46 120 46 C154 46 178 70 176 106 C166 88 154 78 142 74 L136 92 L126 74 L118 94 L108 74 L96 90 L88 72 C74 80 67 92 64 106 Z" fill="#3B414B"/>

  <!-- 眉毛 -->
  <path d="M88 106 q12 -6 23 -2" fill="none" stroke="#3B414B" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <path d="M152 106 q-12 -6 -23 -2" fill="none" stroke="#3B414B" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

  <!-- 眼睛 -->
  <ellipse cx="99" cy="124" rx="10" ry="12" fill="#5C8DA8"/>
  <ellipse cx="141" cy="124" rx="10" ry="12" fill="#5C8DA8"/>
  <ellipse cx="99" cy="124" rx="5.5" ry="7" fill="#2C3A44"/>
  <ellipse cx="141" cy="124" rx="5.5" ry="7" fill="#2C3A44"/>
  <circle cx="95.5" cy="119.5" r="3" fill="#FFFFFF"/>
  <circle cx="137.5" cy="119.5" r="3" fill="#FFFFFF"/>

  <!-- 腮红 + 嘴 -->
  <ellipse cx="83" cy="142" rx="9" ry="5" fill="#F0A8A8" opacity="0.5"/>
  <ellipse cx="157" cy="142" rx="9" ry="5" fill="#F0A8A8" opacity="0.5"/>
  <path d="M113 144 q7 7 14 0" fill="none" stroke="#8C5B4E" stroke-width="3" stroke-linecap="round"/>

  <!-- 肩上探头的暹罗猫 -->
