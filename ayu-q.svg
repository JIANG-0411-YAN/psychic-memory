<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="480" height="480">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2F6F8"/>
      <stop offset="100%" stop-color="#DCE7EC"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B565F"/>
      <stop offset="100%" stop-color="#39424B"/>
    </linearGradient>
  </defs>

  <!-- 底色圆 -->
  <circle cx="120" cy="120" r="112" fill="url(#bg)"/>
  <!-- 身后的小岛 + 海 -->
  <path d="M28 190 q22 -26 46 -26 q24 0 40 26 z" fill="#B9CCC2" opacity="0.55"/>
  <path d="M0 196 q30 10 60 0 q30 -10 60 0 q30 10 60 0 q30 -10 60 0 v44 H0 z" fill="#C9DAE2" opacity="0.7"/>

  <!-- 脖子 -->
  <rect x="104" y="150" width="32" height="22" rx="10" fill="#EBCDB8"/>

  <!-- 身体（卫衣） -->
  <path d="M56 240 C56 198 80 174 120 174 C160 174 184 198 184 240 Z" fill="url(#hoodie)"/>
  <path d="M96 174 q24 16 48 0 l0 12 q-24 14 -48 0 z" fill="#333B43"/>
  <!-- 胸口小岛图案 -->
  <circle cx="120" cy="212" r="17" fill="#2F373E"/>
  <path d="M110 216 q10 -13 20 0 z" fill="#8FBF9E"/>
  <path d="M108 217 q6 4 12 0 q6 -4 12 0" fill="none" stroke="#7FB3C8" stroke-width="2.4" stroke-linecap="round"/>

  <!-- 头发底 -->
  <path d="M63 116 C58 66 82 40 120 40 C158 40 182 66 177 116 C177 96 170 76 152 70 C141 82 130 86 120 86 C107 86 95 81 87 71 C72 79 65 96 63 116 Z" fill="#3B414B"/>
