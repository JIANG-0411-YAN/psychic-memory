    <path d="M-16 -6 l-4 -16 l15 9 z" fill="#6B4B3A"/>
    <path d="M16 -6 l4 -16 l-15 9 z" fill="#6B4B3A"/>
    <circle cx="0" cy="0" r="17" fill="#F0E6D6"/>
    <ellipse cx="0" cy="4" rx="10" ry="8" fill="#6B4B3A" opacity="0.85"/>
    <circle cx="-6" cy="-1" r="3" fill="#7FB3C8"/>
    <circle cx="6" cy="-1" r="3" fill="#7FB3C8"/>
    <circle cx="-6" cy="-1" r="1.3" fill="#2C3A44"/>
    <circle cx="6" cy="-1" r="1.3" fill="#2C3A44"/>
    <path d="M-3 6 q3 3 6 0" fill="none" stroke="#4A3428" stroke-width="1.6" stroke-linecap="round"/>
