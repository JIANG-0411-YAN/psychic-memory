<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>国际会计知识库 - Oxford Brookes</title>
<style>
  :root {
    --bg: #f5f3ef;
    --card: #ffffff;
    --text: #2c2416;
    --text-secondary: #6b5e4f;
    --accent: #1a3c5e;
    --accent-light: #e8f0f8;
    --border: #e0d9ce;
    --tag: #3a6b4c;
    --tag-bg: #eaf5ee;
    --highlight: #fdf3c7;
    --danger: #c0392b;
    --danger-bg: #fdecea;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "PingFang SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header {
    background: var(--accent);
    color: white;
    padding: 28px 0 20px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.1);
  }
  header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.3px; }
  header .subtitle { font-size: .85rem; opacity: .75; margin-top: 2px; }

  /* Search */
  .search-wrap { margin: 24px auto; position: relative; max-width: 960px; padding: 0 20px; }
  .search-wrap input {
    width: 100%; padding: 14px 20px 14px 48px; font-size: 1rem;
    border: 2px solid var(--border); border-radius: 14px; background: var(--card);
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-light); }
  .search-wrap .search-icon {
    position: absolute; left: 38px; top: 50%; transform: translateY(-50%);
    color: #999; font-size: 1.1rem; pointer-events: none;
  }
  .no-result {
    text-align:center; padding:48px 20px; color:var(--text-secondary); font-size:.95rem;
    display:none;
  }
  .no-result.show { display:block; }

  /* Stats bar */
  .stats-bar {
    display:flex; gap:12px; flex-wrap:wrap; margin:0 auto 16px; max-width:960px;
    padding:0 20px; font-size:.82rem; color:var(--text-secondary);
  }
  .stats-bar span { background:var(--card); padding:4px 12px; border-radius:20px; border:1px solid var(--border); }

  /* Category tabs */
  .tabs { display:flex; gap:8px; overflow-x:auto; margin:0 auto 20px; max-width:960px; padding:0 20px; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    white-space:nowrap; padding:8px 18px; border-radius:20px; font-size:.85rem;
    border:1px solid var(--border); background:var(--card); cursor:pointer;
    transition: all .15s; color:var(--text-secondary); user-select:none; flex-shrink:0;
  }
  .tab:hover { border-color:var(--accent); color:var(--accent); }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* Knowledge cards */
  .kb-list { max-width:960px; margin:0 auto; padding:0 20px 60px; display:flex; flex-direction:column; gap:14px; }
  .kb-card {
    background:var(--card); border-radius:14px; border:1px solid var(--border);
    padding:22px 24px; transition: box-shadow .2s, border-color .2s;
    cursor: default;
  }
  .kb-card:hover { box-shadow:0 2px 16px rgba(0,0,0,.06); border-color:#ccc; }
  .kb-card.hidden { display:none; }
  .kb-card .card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .kb-card .card-title { font-size:1.05rem; font-weight:700; color:var(--accent); }
  .kb-card .card-tags { display:flex; gap:6px; flex-wrap:wrap; margin-top:4px; }
  .kb-card .card-tag {
    font-size:.72rem; padding:3px 10px; border-radius:12px;
    background:var(--tag-bg); color:var(--tag); font-weight:600;
  }
  .kb-card .card-content { margin-top:12px; font-size:.9rem; color:var(--text-secondary); }
  .kb-card .card-content p { margin-bottom:8px; }
  .kb-card .card-content ul { padding-left:20px; margin:6px 0; }
  .kb-card .card-content li { margin-bottom:4px; }
  .kb-card .card-content strong { color:var(--text); }

  /* Tables */
  .kb-table {
    width:100%; border-collapse:collapse; margin:12px 0; font-size:.85rem;
  }
  .kb-table th {
    background:var(--accent); color:#fff; padding:10px 14px; text-align:left; font-weight:600;
  }
  .kb-table th:first-child { border-radius:8px 0 0 0; }
  .kb-table th:last-child { border-radius:0 8px 0 0; }
  .kb-table td {
    padding:9px 14px; border-bottom:1px solid var(--border);
  }
  .kb-table tr:nth-child(even) td { background:#faf9f7; }
  .kb-table tr:last-child td:first-child { border-radius:0 0 0 8px; }
  .kb-table tr:last-child td:last-child { border-radius:0 0 8px 0; }

  /* Highlight note */
  .note-highlight {
    background:var(--highlight); border-left:4px solid #e6c940;
    padding:10px 14px; border-radius:0 8px 8px 0; margin:10px 0; font-size:.85rem;
  }
  .note-danger {
    background:var(--danger-bg); border-left:4px solid var(--danger);
    padding:10px 14px; border-radius:0 8px 8px 0; margin:10px 0; font-size:.85rem;
  }

  /* Back to top */
  .back-top {
    position:fixed; bottom:28px; right:28px; width:44px; height:44px;
    border-radius:50%; background:var(--accent); color:#fff; border:none;
    cursor:pointer; font-size:1.2rem; box-shadow:0 2px 12px rgba(0,0,0,.15);
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .back-top.visible { opacity:1; pointer-events:auto; }

  mark { background:var(--highlight); padding:1px 3px; border-radius:3px; }

  @media (max-width:600px) {
    header h1 { font-size:1.25rem; }
    .kb-card { padding:16px; }
    .kb-table { font-size:.78rem; }
    .kb-table th, .kb-table td { padding:7px 8px; }
  }
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>📘 国际会计知识库</h1>
    <div class="subtitle">International Accounting · Oxford Brookes University</div>
  </div>
</header>

<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input type="text" id="searchInput" placeholder="搜索知识点，比如 income statement 结构、IFRS、ratio 公式…" autocomplete="off">
</div>
<div class="stats-bar">
  <span id="statTotal">共 0 个知识点</span>
  <span id="statShowing">显示 0 个</span>
</div>
<div class="tabs" id="tabsContainer"></div>
<div class="no-result" id="noResult">😕 没找到匹配的知识点，试试别的关键词吧</div>
<div class="kb-list" id="kbList"></div>
<button class="back-top" id="backTop" title="回到顶部">↑</button>

<script>
const knowledgeBase = [
  // ──────────── INCOME STATEMENT ────────────
  {
    id: 1,
    category: "Income Statement",
    title: "利润表基本结构 (Multi-step Format)",
    tags: ["income statement", "结构", "格式", "multi-step"],
    content: `
      <p>国际会计中利润表通常采用<strong>多步式 (Multi-step)</strong>格式，分为以下几个层次：</p>
      <table class="kb-table">
        <tr><th>层次</th><th>英文</th><th>计算逻辑</th></tr>
        <tr><td>销售收入</td><td>Sales Revenue / Turnover</td><td>—</td></tr>
        <tr><td>减：销售成本</td><td>Less: Cost of Goods Sold</td><td>—</td></tr>
        <tr><td><strong>= 毛利润</strong></td><td><strong>Gross Profit</strong></td><td>Sales − COGS</td></tr>
        <tr><td>减：营业费用</td><td>Less: Operating Expenses</td><td>Selling + Admin + Depreciation</td></tr>
        <tr><td><strong>= 营业利润</strong></td><td><strong>Operating Income / EBIT</strong></td><td>GP − OpEx</td></tr>
        <tr><td>加/减：其他收入/费用</td><td>Other Income / Expense</td><td>Interest, dividends, gains/losses</td></tr>
        <tr><td><strong>= 税前利润</strong></td><td><strong>Profit Before Tax</strong></td><td>EBIT ± Other</td></tr>
        <tr><td>减：所得税</td><td>Less: Income Tax Expense</td><td>—</td></tr>
        <tr><td><strong>= 净利润</strong></td><td><strong>Net Profit / Net Income</strong></td><td>PBT − Tax</td></tr>
      </table>
      <div class="note-highlight">💡 <strong>IFRS下注意：</strong>IFRS没有规定统一的利润表格式，但要求至少呈现 revenue、finance costs、tax expense、profit or loss 等行项目 (IAS 1.82)。</div>
    `
  },
  {
    id: 2,
    category: "Income Statement",
    title: "利润表 — 单步式 vs 多步式",
    tags: ["income statement", "single-step", "multi-step"],
    content: `
      <p><strong>Single-step（单步式）：</strong>所有收入归在一起，所有费用归在一起，一步算出净利润。结构简单，但信息量少。</p>
      <p><strong>Multi-step（多步式）：</strong>分步计算毛利、营业利润、税前利润、净利润。能更清晰展示不同层次的盈利能力。</p>
      <div class="note-highlight">💡 英美公司普遍使用多步式，IFRS和US GAAP都允许两种格式。但多步式在分析中更有用（比如计算毛利率、营业利润率）。</div>
    `
  },
  {
    id: 3,
    category: "Income Statement",
    title: "利润表关键注意事项 (Exam Tips)",
    tags: ["income statement", "注意事项", "考试"],
    content: `
      <ul>
        <li><strong>Accruals concept（权责发生制）：</strong>收入和费用必须在<em>发生的期间</em>确认，而不是现金收付的期间。</li>
        <li><strong>Matching principle（配比原则）：</strong>费用必须与其产生的收入匹配在同一期间。</li>
        <li><strong>Prepayments & Accruals：</strong>年末调整——预付费用要从费用中扣除，应计费用要加回。</li>
        <li><strong>Depreciation（折旧）：</strong>straight-line 还是 reducing balance？注意 full-year charge 还是 pro-rata。</li>
        <li><strong>Bad debts & Provision：</strong>坏账直接冲销，以及 doubtful debts provision 的增加/减少如何处理。</li>
        <li><strong>Closing inventory：</strong>期末存货影响 COGS——别忘了 lower of cost and NRV。</li>
        <li><strong>非经常性项目：</strong>IFRS下禁止使用"extraordinary items"（IAS 1.87），但US GAAP允许在特定条件下列示。</li>
      </ul>
      <div class="note-danger">⚠️ <strong>常见丢分点：</strong>忘记调整 prepayment/accrual、把 capital expenditure 当作 revenue expenditure、inventory 计价错误。</div>
    `
  },
  {
    id: 4,
    category: "Income Statement",
    title: "OCI 与 Statement of Comprehensive Income",
    tags: ["income statement", "OCI", "comprehensive income"],
    content: `
      <p>IFRS下，完整的业绩报表包括两部分：</p>
      <table class="kb-table">
        <tr><th>部分</th><th>内容</th></tr>
        <tr><td><strong>Profit or Loss (P&L)</strong></td><td>净利润（已实现的收入费用）</td></tr>
        <tr><td><strong>Other Comprehensive Income (OCI)</strong></td><td>未实现的利得/损失，如：revaluation surplus, actuarial gains/losses, FX translation differences, FVTOCI financial assets 的公允价值变动</td></tr>
        <tr><td><strong>= Total Comprehensive Income</strong></td><td>P&L + OCI</td></tr>
      </table>
      <p>公司可以呈现<strong>单一报表</strong>（Statement of Comprehensive Income）或<strong>两张报表</strong>（Income Statement + Statement of Comprehensive Income）。</p>
      <div class="note-highlight">💡 OCI项目不会被recycle到P&L（除了一些例外，如foreign operation disposal时FX translation differences会重分类）。</div>
    `
  },

  {
    id: 21,
    category: "Income Statement",
    title: "利润表中英对照详细结构 (Multi-step)",
    tags: ["income statement", "结构", "中英对照", "详细"],
    content: `
      <p>完整的<strong>多步式利润表</strong>中英对照结构：</p>
      <table class="kb-table">
        <tr><th>中文项目</th><th>English Item</th><th>金额</th></tr>
        <tr><td>销售净额</td><td><strong>Net Sales / Revenue</strong></td><td>xxx</td></tr>
        <tr><td>减：销售成本</td><td>Less: Cost of Goods Sold (COGS)</td><td>(xxx)</td></tr>
        <tr><td><strong>= 毛利润</strong></td><td><strong>= Gross Profit</strong></td><td><strong>xxx</strong></td></tr>
        <tr><td>减：销售费用</td><td>Less: Selling Expenses</td><td>(xxx)</td></tr>
        <tr><td>减：管理费用</td><td>Less: Administrative Expenses</td><td>(xxx)</td></tr>
        <tr><td><strong>= 营业利润</strong></td><td><strong>= Operating Income / EBIT</strong></td><td><strong>xxx</strong></td></tr>
        <tr><td>加：其他收入</td><td>Add: Other Revenues & Gains</td><td>xxx</td></tr>
        <tr><td>减：其他费用</td><td>Less: Other Expenses & Losses</td><td>(xxx)</td></tr>
        <tr><td><strong>= 税前利润</strong></td><td><strong>= Income Before Tax (PBT)</strong></td><td><strong>xxx</strong></td></tr>
        <tr><td>减：所得税费用</td><td>Less: Income Tax Expense</td><td>(xxx)</td></tr>
        <tr><td><strong>= 净利润</strong></td><td><strong>= Net Income / Net Profit</strong></td><td><strong>xxx</strong></td></tr>
      </table>
      <div class="note-highlight">💡 <strong>记忆要点：</strong>Selling Expenses 和 Admin Expenses 是<em>分开列示</em>的，不要合并。Other Revenues 包括利息收入、租金收入、资产处置利得等；Other Expenses 包括利息费用、资产处置损失等。</div>
      <div class="note-danger">⚠️ <strong>考试注意：</strong>COGS = Opening Inventory + Purchases − Closing Inventory。如果题目给的是periodic inventory system，别忘了算COGS再填表。</div>
    `
  },

  // ──────────── BALANCE SHEET ────────────
  {
    id: 5,
    category: "Balance Sheet",
    title: "资产负债表基本结构",
    tags: ["balance sheet", "SOFP", "结构", "资产", "负债"],
    content: `
      <p>IFRS下称为<strong>Statement of Financial Position (SOFP)</strong>。基本等式：</p>
      <p style="text-align:center;font-size:1.1rem;font-weight:700;margin:12px 0;color:var(--accent);">Assets = Liabilities + Equity</p>
      <table class="kb-table">
        <tr><th>分类</th><th>内容</th></tr>
        <tr><td><strong>Non-current Assets</strong></td><td>PPE, Intangible assets, Goodwill, Investments, Deferred tax assets</td></tr>
        <tr><td><strong>Current Assets</strong></td><td>Inventories, Trade receivables, Prepayments, Cash & cash equivalents</td></tr>
        <tr><td><strong>Equity</strong></td><td>Share capital, Share premium, Retained earnings, Other reserves</td></tr>
        <tr><td><strong>Non-current Liabilities</strong></td><td>Long-term borrowings, Deferred tax liabilities, Provisions</td></tr>
        <tr><td><strong>Current Liabilities</strong></td><td>Trade payables, Accruals, Short-term borrowings, Tax payable</td></tr>
      </table>
      <div class="note-highlight">💡 IFRS下资产负债表没有固定格式，但 IAS 1.60 要求区分 current/non-current（除非按流动性列示更合适，如银行）。</div>
    `
  },
  {
    id: 6,
    category: "Balance Sheet",
    title: "Current vs Non-current 判断标准",
    tags: ["balance sheet", "current", "non-current", "分类"],
    content: `
      <p>根据 IAS 1.66-76，一项资产属于 <strong>Current</strong>，如果满足以下任一条件：</p>
      <ul>
        <li>预期在正常经营周期内实现/出售/消耗</li>
        <li>主要为交易目的而持有</li>
        <li>预期在报告日后12个月内实现</li>
        <li>是现金或现金等价物（除非在12个月内受限制）</li>
      </ul>
      <p>负债属于 <strong>Current</strong>，如果：</p>
      <ul>
        <li>预期在正常经营周期内结算</li>
        <li>主要为交易目的而持有</li>
        <li>预期在报告日后12个月内到期</li>
        <li>没有无条件延迟结算至少12个月的权利</li>
      </ul>
      <div class="note-danger">⚠️ <strong>注意：</strong>如果长期负债在12个月内到期但公司有refinancing agreement，在特定条件下仍可分类为non-current。</div>
    `
  },

  {
    id: 22,
    category: "Balance Sheet",
    title: "资产负债表中英对照详细结构 (SOFP)",
    tags: ["balance sheet", "SOFP", "中英对照", "详细结构"],
    content: `
      <p>IFRS下称为<strong>Statement of Financial Position</strong>，完整中英对照结构：</p>
      <table class="kb-table">
        <tr><th colspan="2" style="text-align:center;">ASSETS 资产</th></tr>
        <tr><th>中文项目</th><th>English Item</th></tr>
        <tr><td colspan="2"><strong>Non-current Assets 非流动资产</strong></td></tr>
        <tr><td>不动产、厂房和设备</td><td>Property, Plant & Equipment (PPE)</td></tr>
        <tr><td>无形资产</td><td>Intangible Assets</td></tr>
        <tr><td>商誉</td><td>Goodwill</td></tr>
        <tr><td>长期投资</td><td>Long-term Investments</td></tr>
        <tr><td>递延所得税资产</td><td>Deferred Tax Assets</td></tr>
        <tr><td colspan="2"><strong>Current Assets 流动资产</strong></td></tr>
        <tr><td>存货</td><td>Inventories</td></tr>
        <tr><td>应收账款</td><td>Trade Receivables / Accounts Receivable</td></tr>
        <tr><td>预付费用</td><td>Prepayments / Prepaid Expenses</td></tr>
        <tr><td>其他应收款</td><td>Other Receivables</td></tr>
        <tr><td>现金及现金等价物</td><td>Cash & Cash Equivalents</td></tr>
        <tr><td style="text-align:right;"><strong>资产总计</strong></td><td><strong>Total Assets</strong></td></tr>
      </table>
      <table class="kb-table" style="margin-top:16px;">
        <tr><th colspan="2" style="text-align:center;">EQUITY & LIABILITIES 权益与负债</th></tr>
        <tr><th>中文项目</th><th>English Item</th></tr>
        <tr><td colspan="2"><strong>Equity 所有者权益</strong></td></tr>
        <tr><td>股本</td><td>Share Capital</td></tr>
        <tr><td>股本溢价</td><td>Share Premium / Additional Paid-in Capital</td></tr>
        <tr><td>留存收益</td><td>Retained Earnings</td></tr>
        <tr><td>重估盈余</td><td>Revaluation Surplus</td></tr>
        <tr><td>其他储备</td><td>Other Reserves</td></tr>
        <tr><td colspan="2"><strong>Non-current Liabilities 非流动负债</strong></td></tr>
        <tr><td>长期借款</td><td>Long-term Borrowings / Loans</td></tr>
        <tr><td>递延所得税负债</td><td>Deferred Tax Liabilities</td></tr>
        <tr><td>长期准备</td><td>Long-term Provisions</td></tr>
        <tr><td colspan="2"><strong>Current Liabilities 流动负债</strong></td></tr>
        <tr><td>应付账款</td><td>Trade Payables / Accounts Payable</td></tr>
        <tr><td>应计费用</td><td>Accruals / Accrued Expenses</td></tr>
        <tr><td>短期借款</td><td>Short-term Borrowings</td></tr>
        <tr><td>应交税费</td><td>Tax Payable</td></tr>
        <tr><td>预收收入</td><td>Deferred Income / Unearned Revenue</td></tr>
        <tr><td style="text-align:right;"><strong>权益与负债总计</strong></td><td><strong>Total Equity & Liabilities</strong></td></tr>
      </table>
      <div class="note-highlight">💡 <strong>记忆要点：</strong>预收收入 (Deferred Income) 是负债不是收入——收了钱还没提供服务，属于current liability。预付费用是资产——付了钱还没收到服务。</div>
      <div class="note-danger">⚠️ <strong>考试注意：</strong>Total Assets 必须等于 Total Equity & Liabilities，差一分钱都不行！检查时先对等式。</div>
    `
  },

  // ──────────── CASH FLOW ────────────
  {
    id: 7,
    category: "Cash Flow",
    title: "现金流量表三大分类 (IAS 7)",
    tags: ["cash flow", "IAS 7", "operating", "investing", "financing"],
    content: `
      <table class="kb-table">
        <tr><th>分类</th><th>英文</th><th>典型项目</th></tr>

    content: `
      <p><strong>基准处理 vs 允许替代：</strong>IAS 23要求所有符合条件的借款费用必须资本化（不再允许费用化）。</p>

        <li>借款费用已发生（borrowing costs incurred）</li>
        <li>为使资产达到预定用途的必要活动已开始（activities in progress）</li>

      <p><strong>暂停资本化：</strong>开发活动中断较长时间（非必要中断）时应暂停。</p>

    content: `

      <p><strong>NCI两种计量方式（IFRS 3允许选择）：</strong></p>
      <ul>

    content: `

    category: "Financial Ratios",
    title: "比率分析 — 考试常见问答题型",
    tags: ["ratios", "analysis", "exam", "interpretation"],
    content: `
      <p><strong>比率分析的逻辑框架（考试大题必备）：</strong></p>
      <p><strong>1. Profitability（盈利能力）：</strong></p>
      <ul>
        <li>Gross Margin = GP / Revenue — 反映定价能力和成本控制</li>
        <li>Operating Margin = Operating Profit / Revenue — 反映经营效率</li>
        <li>ROCE = Operating Profit / (Total Assets − Current Liabilities) — 资本回报率</li>
        <li>ROE = PAT / Equity — 股东回报</li>
      </ul>
      <p><strong>2. Liquidity（流动性）：</strong></p>
      <ul>
        <li>Current Ratio = CA / CL（理想值 ≥ 1.5~2）</li>
        <li>Quick Ratio = (CA − Inventory) / CL（理想值 ≥ 1）</li>
        <li>太低 → 流动性风险；太高 → 资金利用效率低</li>
      </ul>
      <p><strong>3. Efficiency（效率）：</strong></p>
      <ul>
        <li>Inventory Days = Inventory / COGS × 365</li>
        <li>Receivable Days = Receivables / Revenue × 365</li>
        <li>Payable Days = Payables / COGS × 365</li>
        <li>Asset Turnover = Revenue / Total Assets</li>
      </ul>
      <p><strong>4. Gearing（杠杆）：</strong></p>
      <ul>
        <li>Gearing = Debt / (Debt + Equity) 或 Debt / Equity</li>
        <li>Interest Cover = Operating Profit / Finance Cost</li>
      </ul>
      <div class="note-highlight">⚠️ <strong>答题技巧：</strong>不要只列数字，要解释"为什么变了"——是经营原因还是会计政策变更？横向对比行业，纵向对比去年。指出limitations（历史成本、window dressing等）。</div>
    `

    id: 33,
    category: "Balance Sheet",
    title: "折旧方法详解与计算 (Depreciation Methods)",
    tags: ["depreciation", "straight-line", "reducing balance", "折旧"],
    content: `
      <p><strong>Straight-Line（直线法）：</strong>(Cost − Residual Value) / Useful Life</p>
      <p>每年折旧额相等，适合均匀消耗的资产（如建筑物）。</p>
      <p><strong>Reducing Balance / Diminishing Balance（余额递减法）：</strong>Carrying Amount × Depreciation Rate (%)</p>
      <p>早期折旧多、后期少，适合技术更新快的资产（如IT设备）。</p>
      <p><strong>Units of Production（工作量法）：</strong>(Cost − RV) / Total Estimated Units × Actual Units</p>
      <p>适合使用量不均衡的资产（如矿场、飞机发动机）。</p>
      <p><strong>折旧变更处理（IAS 8 + IAS 16）：</strong></p>
      <ul>
        <li>残值和使用寿命变更 → 会计估计变更（Prospective）</li>
        <li>折旧方法变更 → 会计估计变更（Prospective），因为反映了预期消耗模式的变化</li>
      </ul>
      <table class="kb-table">
        <tr><th>情景</th><th>分录</th></tr>
        <tr><td>计提折旧</td><td>Dr Depreciation Expense (P/L) / Cr Accumulated Depreciation (SOFP)</td></tr>
        <tr><td>处置资产</td><td>Dr Cash / Dr Acc. Depr. / Cr Asset Cost / Dr/Cr Gain or Loss (P/L)</td></tr>
      </table>
      <div class="note-highlight">💡 IAS 16要求至少每年review折旧方法和残值。土地通常不折旧（无限寿命），但采掘业除外。</div>
    `

    title: "坏账与坏账准备 (Bad Debts & Allowance)",
    tags: ["bad debts", "allowance", "receivables", "坏账"],
    content: `
      <p><strong>Bad Debts（坏账/已确认坏账）：</strong>确定无法收回的应收账款。</p>
      <p>Dr Bad Debt Expense (P/L) / Cr Trade Receivables (SOFP)</p>
      <p><strong>Allowance for Doubtful Debts（坏账准备/计提）：</strong>估计可能无法收回的金额，不直接冲销。</p>
      <p>Dr Bad Debt Expense (P/L) / Cr Allowance for Receivables (SOFP)</p>
      <p><strong>后续调整：</strong></p>
      <ul>
        <li>坏账准备增加（期末 > 期初）：补提差额 → Dr Expense, Cr Allowance</li>
        <li>坏账准备减少（期末 < 期初）：冲回差额 → Dr Allowance, Cr Income</li>

      <p><strong>SOFP列报：</strong>Trade Receivables (Gross) − Allowance = Net Receivables</p>
      <div class="note-highlight">⚠️ <strong>考试陷阱：</strong>区分具体坏账冲销（write-off）和一般坏账准备（general allowance）。Write-off是已知坏账，Allowance是估计。两者的Movement都影响P/L。</div>

    id: 35,
    category: "Balance Sheet",
    title: "存货计价方法 — FIFO vs AVCO",
    tags: ["inventory", "FIFO", "AVCO", "IAS 2", "存货"],
    content: `
      <p><strong>IAS 2允许的方法：</strong>FIFO（先进先出）和Weighted Average Cost（加权平均法）。LIFO在IFRS下禁止。</p>
      <table class="kb-table">
        <tr><th></th><th>FIFO</th><th>AVCO</th></tr>
        <tr><td>原理</td><td>最早购入的先售出</td><td>所有存货按加权平均成本</td></tr>
        <tr><td>期末存货</td><td>接近当前市价（最新成本）</td><td>平均成本</td></tr>
        <tr><td>COGS</td><td>较低（通胀时）</td><td>中等</td></tr>
        <tr><td>利润</td><td>较高（通胀时）</td><td>中等</td></tr>
        <tr><td>税务</td><td>更多税（高利润）</td><td>较少税</td></tr>
      </table>
      <p><strong>AVCO计算：</strong>每次进货后重新计算平均成本 = 总成本 / 总数量。出货时按当前平均成本计价。</p>
      <p><strong>NRV test（IAS 2核心）：</strong>Inventory = Lower of Cost and NRV（可变现净值）。NRV = 估计售价 − 完工成本 − 销售费用。</p>
      <div class="note-highlight">💡 LIFO禁止原因：LIFO导致期末存货反映过时的历史成本，不符合IAS 2对存货计量的要求。但US GAAP仍允许LIFO。</div>
    `
  },

    id: 36,
    category: "IAS & IFRS Key Standards",
    title: "IFRS 3 — 企业合并 (Business Combinations)",
    tags: ["IFRS 3", "business combination", "acquisition method", "企业合并"],
    content: `
      <p><strong>Acquisition Method（购买法）四步骤：</strong></p>
      <ol>

      <p><strong>Contingent Consideration（或有对价）：</strong>按收购日公允价值确认。后续变动一般计入P/L。</p>

        <li><strong>内部：</strong>资产陈旧/损坏、资产使用方式不利变化、内部报告显示资产经济绩效低于预期</li>

      <p><strong>Recoverable Amount = Higher of:</strong></p>
      <ul>

// ─── Build UI ───
const kbList = document.getElementById('kbList');
const tabsContainer = document.getElementById('tabsContainer');
const searchInput = document.getElementById('searchInput');
const noResult = document.getElementById('noResult');
const statTotal = document.getElementById('statTotal');
const statShowing = document.getElementById('statShowing');

// Get unique categories
const categories = [...new Set(knowledgeBase.map(k => k.category))];

// Build tabs
tabsContainer.innerHTML = `<span class="tab active" data-cat="all">全部</span>` +
  categories.map(c => `<span class="tab" data-cat="${c}">${c}</span>`).join('');

// Build cards
function renderCards(filtered) {
  kbList.innerHTML = '';
  if (filtered.length === 0) {
    noResult.classList.add('show');
    statShowing.textContent = '显示 0 个';
  } else {
    noResult.classList.remove('show');
    statShowing.textContent = `显示 ${filtered.length} 个`;
  }
  filtered.forEach(k => {
    const card = document.createElement('div');
    card.className = 'kb-card';
    card.setAttribute('data-category', k.category);
    card.setAttribute('data-id', k.id);
    card.innerHTML = `
      <div class="card-header">
        <div>
          <div class="card-title">${highlightMatch(k.title)}</div>
          <div class="card-tags">${k.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}</div>
        </div>
      </div>
      <div class="card-content">${k.content}</div>
    `;
    kbList.appendChild(card);
  });
}

function highlightMatch(text) {
  const q = searchInput.value.trim();
  if (!q || q.length < 2) return text;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

function getFiltered() {
  const q = searchInput.value.trim().toLowerCase();
  const activeCat = document.querySelector('.tab.active')?.dataset.cat || 'all';
  return knowledgeBase.filter(k => {
    const matchCat = activeCat === 'all' || k.category === activeCat;
    if (!q || q.length < 2) return matchCat;
    const matchQ = k.title.toLowerCase().includes(q) ||
      k.tags.some(t => t.toLowerCase().includes(q)) ||
      k.content.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
}

function updateAll() {
  renderCards(getFiltered());
}

// Events
searchInput.addEventListener('input', updateAll);

tabsContainer.addEventListener('click', e => {
  if (e.target.classList.contains('tab')) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    updateAll();
  }
});

// Init
statTotal.textContent = `共 ${knowledgeBase.length} 个知识点`;
updateAll();

// Back to top
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => {
  backTop.classList.toggle('visible', window.scrollY > 400);
});
backTop.addEventListener('click', () => window.scrollTo({top:0,behavior:'smooth'}));

// Keyboard shortcut: Ctrl+K or / to focus search
document.addEventListener('keydown', e => {
  if ((e.ctrlKey && e.key === 'k') || (e.key === '/' && document.activeElement !== searchInput)) {
    e.preventDefault();
    searchInput.focus();
    searchInput.select();
  }
});
</script>
