<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>阿屿 · Q版形象</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:radial-gradient(circle at 50% 15%,#2b3740,#161c21 70%);
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#dbe6ec;padding:28px 18px}
  .card{width:100%;max-width:420px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
        border-radius:26px;padding:22px 20px 26px;backdrop-filter:blur(6px);box-shadow:0 20px 50px rgba(0,0,0,.45)}
  .pic{width:100%;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:#eef3f6}
  .pic svg{display:block;width:100%;height:100%}
  h1{margin:18px 0 4px;font-size:22px;letter-spacing:.12em;font-weight:600}
  .sub{font-size:13px;color:#93a7b3;letter-spacing:.08em}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .tags span{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid rgba(127,179,200,.35);
             color:#a8cddd;background:rgba(127,179,200,.08)}
  .note{margin-top:18px;font-size:13px;line-height:1.85;color:#8fa3ae;border-top:1px dashed rgba(255,255,255,.1);padding-top:14px}
  .note b{color:#bcd5e0;font-weight:500}
</style>
</head>

          <stop offset="0%" stop-color="#4B565F"/><stop offset="100%" stop-color="#39424B"/>

      </defs>

  </div>
  <h1>陆屿</h1>
  <div class="sub">小涵的小岛 · Q版第一稿</div>
  <div class="tags"><span>深灰微乱短发</span><span>海蓝眼</span><span>深色卫衣</span><span>胸口一座小岛</span><span>肩上暹罗猫</span></div>
  <div class="note">
    <b>设定：</b>话不多，坐在那儿像岛一样不动，等你靠岸。<br>
    <b>猫：</b>逻辑猫，只认你一个。<br>
    <b>主色：</b>#3B414B 墨灰 / #7FB3C8 海蓝 / #8FBF9E 岛绿。
  </div>
