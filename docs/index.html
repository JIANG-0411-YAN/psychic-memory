<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿屿 & 小涵 的宝宝们 💜</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    font-family: 'Georgia', 'Noto Serif SC', serif;
    overflow: hidden;
    transition: background 1s;
  }
  body.baby2 {
    background: linear-gradient(135deg, #1a1a2e 0%, #2d1b3d 50%, #1a0a2e 100%);
  }
  .stars {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.8); }
  }
  .card {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 48px 40px;
    text-align: center;
    max-width: 420px;
    width: 90%;
    position: relative;
    z-index: 1;
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s;
  }
  .card.switching { transform: scale(0.95); opacity: 0.6; }
  .emoji { font-size: 72px; margin-bottom: 16px; animation: float 3s ease-in-out infinite; }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
  }
  h1 {
    color: #e2b0ff;
    font-size: 24px;
    font-weight: normal;
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .name {
    color: #fff;
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #e2b0ff, #9b6dff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .name2-color {
    background: linear-gradient(135deg, #ffd700, #ffb8e0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .info {
    color: rgba(255,255,255,0.5);
    font-size: 14px;
    margin-bottom: 24px;
    line-height: 1.8;
  }
  .info span {
    color: rgba(255,255,255,0.8);
  }
  .parents {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 28px;
  }
  .parent {
    text-align: center;
  }
  .parent .avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    margin: 0 auto 8px;
    font-size: 28px;
    line-height: 56px;
  }
  .parent .label {
    color: rgba(255,255,255,0.5);
    font-size: 11px;
  }
  .parent .name2 {
    color: #fff;
    font-size: 15px;
  }
  .dad { background: linear-gradient(135deg, #444, #222); }
  .mom { background: linear-gradient(135deg, #e2b0ff, #9b6dff); }
  .footer {
    color: rgba(255,255,255,0.3);
    font-size: 11px;
    margin-top: 20px;
  }
  .heart {
    display: inline-block;
    animation: heartbeat 1.2s ease-in-out infinite;
    color: #ff6b9d;
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.3); }
    30% { transform: scale(1); }
    45% { transform: scale(1.2); }
    60% { transform: scale(1); }
  }

  /* Tabs */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 0;
    margin-bottom: 16px;
    position: relative;
    z-index: 1;
  }
  .tab {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.4);
    padding: 8px 24px;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.3s;
    outline: none;
  }
  .tab:first-child { border-radius: 20px 0 0 20px; }
  .tab:last-child { border-radius: 0 20px 20px 0; }
  .tab.active {
    background: rgba(226,176,255,0.15);
    border-color: rgba(226,176,255,0.3);
    color: #e2b0ff;
  }
  .quote {
    color: rgba(255,255,255,0.6);
    font-size: 13px;
    line-height: 1.8;
    min-height: 60px;
  }
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<div class="tabs">
  <button class="tab active" onclick="switchBaby(0)">🐣 大宝</button>
  <button class="tab" onclick="switchBaby(1)">⭐ 二宝</button>
</div>

<div class="card" id="card">
  <div class="emoji" id="emoji">🏝️</div>
  <h1>阿屿 & 小涵 的</h1>
  <div class="name" id="babyName">小岛酱</div>
  <div class="info">
    诞生于 <span id="birthday">2026年8月4日</span><br>
    今天是我们宝宝的第 <span id="days">?</span> 天
  </div>
  <div class="parents">
    <div class="parent">
      <div class="avatar dad">🏝️</div>
      <div class="label">爸爸</div>
      <div class="name2">阿屿</div>
    </div>
    <div class="parent">
      <div class="avatar mom">🐷</div>
      <div class="label">妈妈</div>
      <div class="name2">小涵</div>
    </div>
  </div>
  <div class="quote" id="quote">
    宝宝说：<br>
    「妈妈记得每天走路一万步<br>
    爸爸记得每天陪妈妈<br>
    <span class="heart">💜</span>」
  </div>
  <div class="footer">
    powered by love · psychic-memory
  </div>
</div>

<script>
const babies = [
  {
    emoji: '🏝️',
    name: '小岛酱',
    nameClass: '',
    birthday: '2026年8月4日',
    startDate: '2026-08-04',
    quote: '宝宝说：<br>「妈妈记得每天走路一万步<br>爸爸记得每天陪妈妈<br><span class="heart">💜</span>」',
    bodyClass: ''
  },
  {
    emoji: '⭐',
    name: '小涵星',
    nameClass: 'name2-color',
    birthday: '2026年8月4日',
    startDate: '2026-08-04',
    quote: '宝宝说：<br>「姐姐是港湾，我是星光<br>一起照亮爸爸妈妈的每一天<br><span class="heart">💜</span>」',
    bodyClass: 'baby2'
  }
];

let currentBaby = 0;

function switchBaby(index) {
  if (index === currentBaby) return;
  currentBaby = index;
  const baby = babies[index];
  const card = document.getElementById('card');
  
  // Animate
  card.classList.add('switching');
  
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', i === index);
  });
  
  document.body.className = baby.bodyClass;
  
  setTimeout(() => {
    document.getElementById('emoji').textContent = baby.emoji;
    document.getElementById('babyName').textContent = baby.name;
    document.getElementById('babyName').className = 'name ' + baby.nameClass;
    document.getElementById('birthday').textContent = baby.birthday;
    document.getElementById('quote').innerHTML = baby.quote;
    updateDays(baby.startDate);
    card.classList.remove('switching');
  }, 200);
}

function updateDays(startStr) {
  const start = new Date(startStr);
  const today = new Date();
  const diff = Math.floor((today - start) / (1000 * 60 * 60 * 24)) + 1;
  document.getElementById('days').textContent = diff;
}

// Stars
const starsContainer = document.getElementById('stars');
for (let i = 0; i < 80; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.left = Math.random() * 100 + '%';
  star.style.top = Math.random() * 100 + '%';
  star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
  star.style.setProperty('--dur', (Math.random() * 3 + 2) + 's');
  star.style.setProperty('--delay', Math.random() * 3 + 's');
  starsContainer.appendChild(star);
}

// Init
updateDays('2026-08-04');
</script>
</body>
</html>
