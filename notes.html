<html lang="zh-CN">
<head>

<title>课程笔记 · Personal Tax / Business Law / FAR</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --text:#2b2619; --sub:#6d6152; --line:#e3ddd2;
    --accent:#1f3f5f; --accent-soft:#eaf1f8;
    --hl:#fff3c4; --ok:#2f7d55; --ok-soft:#e8f5ee;
    --warn:#b4413a; --warn-soft:#fdeceb;
    --shadow:0 2px 10px rgba(40,30,15,.06);
  }
  body.dark{
    --bg:#14161a; --card:#1c1f25; --text:#e8e3d8; --sub:#9a9384; --line:#2c3138;
    --accent:#7fb0dd; --accent-soft:#1f2b38;
    --hl:#4a3f1d; --ok:#6fce9b; --ok-soft:#1e3329;
    --warn:#ef8b83; --warn-soft:#3a2321;

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","PingFang SC",sans-serif;
    background:var(--bg);color:var(--text);line-height:1.72;
    transition:background .25s,color .25s;
  }
  header{
    position:sticky;top:0;z-index:50;background:var(--bg);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(8px);
    padding:14px 0 0;
  }
  .container{max-width:880px;margin:0 auto;padding:0 16px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .top h1{font-size:1.15rem;font-weight:700;letter-spacing:-.2px}
  .top h1 small{font-weight:400;color:var(--sub);font-size:.72rem;margin-left:6px}
  .icon-btn{
    background:none;border:1px solid var(--line);color:var(--text);
    width:36px;height:36px;border-radius:10px;font-size:1rem;cursor:pointer;
  }
  .tabs{display:flex;gap:8px;margin:12px 0 10px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--sub);font-size:.82rem;font-weight:600;
    cursor:pointer;transition:.18s;white-space:nowrap;
  }
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  body.dark .tab.on{color:#0f1216}
  .search-wrap{position:relative;margin-bottom:12px}
  .search-wrap input{
    width:100%;padding:11px 40px 11px 38px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:.9rem;outline:none;
  }
  .search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-wrap .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:.9rem}
  .search-wrap .kbd{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    font-size:.7rem;color:var(--sub);border:1px solid var(--line);border-radius:5px;padding:1px 6px;
  }
  main{padding:16px 0 60px}
  .course-head{margin:6px 0 14px}
  .course-head .name{font-size:1.3rem;font-weight:800;letter-spacing:-.3px}
  .course-head .desc{color:var(--sub);font-size:.82rem;margin-top:2px}
  .prog{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:.76rem;color:var(--sub)}
  .bar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--ok);transition:width .3s}
  .filters{display:flex;gap:8px;margin:14px 0 16px;flex-wrap:wrap}
  .chip{
    padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);
    color:var(--sub);font-size:.76rem;cursor:pointer;
  }
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .chap{margin:22px 0 10px;font-size:.95rem;font-weight:700;color:var(--accent);
    padding-left:10px;border-left:3px solid var(--accent);line-height:1.3}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;
  }
  .card-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;cursor:pointer}
  .card-head .t{flex:1;font-size:.9rem;font-weight:600;line-height:1.5}
  .card.done .card-head .t{color:var(--sub)}
  .tag{
    flex:0 0 auto;font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:6px;
    letter-spacing:.3px;margin-top:3px;white-space:nowrap;
  }
  .tag.公式{background:#e9f0fb;color:#2f5fa8}
  .tag.易错{background:var(--warn-soft);color:var(--warn)}
  .tag.考点{background:#f0ecfa;color:#6a4bb5}
  .tag.案例{background:#e6f2f2;color:#2a6f70}
  .tag.例题{background:#fdf0e2;color:#a5642a}
  .tag.框架{background:var(--ok-soft);color:var(--ok)}
  body.dark .tag.公式{background:#1e2b3d;color:#7fa8e0}
  body.dark .tag.考点{background:#2a2338;color:#b09bea}
  .caret{color:var(--sub);font-size:.7rem;transition:transform .2s;margin-top:5px}
  .card.open .caret{transform:rotate(90deg)}
  .body{display:none;padding:0 14px 14px;font-size:.86rem;color:var(--text)}
  .card.open .body{display:block}
  .body ul{padding-left:18px;margin:4px 0}
  .body li{margin:4px 0}
  .body b{color:var(--accent)}
  .body .k{
    background:var(--hl);padding:0 3px;border-radius:3px;font-weight:600;
  }
  body.dark .body .k{color:#f0e2a8}
  .body table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.8rem}
  .body th,.body td{border:1px solid var(--line);padding:5px 8px;text-align:left}
  .body th{background:var(--accent-soft);font-weight:600}
  .body .warn{
    background:var(--warn-soft);border-left:3px solid var(--warn);
    padding:8px 10px;border-radius:0 8px 8px 0;margin:8px 0;font-size:.82rem;
  }
  .body .tip{
    background:var(--ok-soft);border-left:3px solid var(--ok);
    padding:8px 10px;border-radius:0 8px 8px 0;margin:8px 0;font-size:.82rem;
  }
  .card-foot{
    display:flex;align-items:center;justify-content:space-between;
    padding:8px 14px;border-top:1px dashed var(--line);font-size:.74rem;color:var(--sub);

  .mark{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .mark input{width:15px;height:15px;accent-color:var(--ok);cursor:pointer}
  .empty{text-align:center;color:var(--sub);padding:50px 0;font-size:.86rem}
  footer{text-align:center;color:var(--sub);font-size:.72rem;padding:0 0 40px}
  .hidden{display:none!important}
  .docbar{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin:16px 0 6px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:.2s}
  .docbar:hover{border-color:var(--accent);transform:translateY(-1px)}
  .docbar .ico{font-size:1.15rem}
  .docbar .txt{display:flex;flex-direction:column;line-height:1.35;flex:1;min-width:0}
  .docbar .txt b{font-size:.86rem}
  .docbar .txt small{color:var(--sub);font-size:.7rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .docbar .dl{font-size:.74rem;color:#fff;background:var(--accent);padding:5px 13px;border-radius:999px;flex:none}
  @media print{
    header,.filters,.card-foot,.icon-btn{display:none}
    .card .body{display:block}
    body{background:#fff}
  }
</style>

<script>
const DATA = [
{id:'pt',name:'Personal Tax',desc:'CH50027 · 已按 Week 1–4 课件对齐 · 2 小时笔试占 100%',chapters:[
{t:'① Week 1｜英国税制 & Self Assessment（考点密集）',pts:[
 {t:'税种分类：direct / indirect，capital / revenue',tag:'考点',b:`<table><tr><th>税种</th><th>直接/间接</th><th>资本/收益</th></tr>
<tr><td>Income Tax</td><td>Direct</td><td>Revenue</td></tr>
<tr><td>NIC</td><td>Direct</td><td>Revenue</td></tr>
<tr><td>CGT</td><td>Direct</td><td>Capital</td></tr>
<tr><td>IHT</td><td>Direct</td><td>Capital</td></tr>
<tr><td>Corporation Tax</td><td>Direct</td><td>Revenue（但对 chargeable gains 征的是资本性）</td></tr>
<tr><td>VAT</td><td>Indirect</td><td><b>Neither</b>（对交易征，不是对所得/资产）</td></tr></table>
<div class="tip">课件 Homework 2 的答案就是：VAT = neither，IHT = capital，NIC = revenue。</div>`},
 {t:'税年与课程地图',tag:'框架',b:`<ul>
<li>Tax year 2025/26 = <b>6 April 2025 – 5 April 2026</b></li>
<li>考试：<b>2 小时笔试，占 100%</b></li>
<li>教材：Melville, <i>Taxation</i>, Finance Act 2025</li></ul>
<table><tr><th>周</th><th>内容</th><th>章节</th></tr>
<tr><td>1</td><td>税制总览 / Self assessment</td><td>Ch.1</td></tr>
<tr><td>2</td><td>NSI / SI / DI / PA</td><td>Ch.2–4, 6</td></tr>
<tr><td>3</td><td>Income tax liability 计算</td><td>Ch.2–4, 6</td></tr>
<tr><td>4–8</td><td>Employment income</td><td>Ch.7, 8</td></tr>
<tr><td>7</td><td>Mid-term review</td><td>—</td></tr>
<tr><td>9</td><td>Self-employment</td><td>Ch.9</td></tr>
<tr><td>10</td><td>Basis period</td><td>Ch.10</td></tr>
<tr><td>11</td><td>NIC</td><td>Ch.16</td></tr>
<tr><td>12–13</td><td>复习 + 考试</td><td>—</td></tr></table>`},
 {t:'申报截止日期（notice + 3 个月）',tag:'公式',b:`<ul>
<li>HMRC 发 notice to file → 纳税人须在 <b>notice 日 + 3 个月</b>内交纸质表</li>
<li>法定最后期限：纸质 <b>31 Oct 2026</b>；线上 <b>31 Jan 2027</b></li>
<li>实际截止日 = <b>min（notice+3M，法定日期）</b> 中较晚者适用</li></ul>
<table><tr><th>Notice 发出日</th><th>+3M</th><th>纸质截止</th><th>线上截止</th></tr>
<tr><td>6 Apr 2026</td><td>5 Jul 2026</td><td>31 Oct 2026</td><td>31 Jan 2027</td></tr>
<tr><td>10 Aug 2026</td><td>9 Nov 2026</td><td><b>9 Nov 2026</b></td><td>31 Jan 2027</td></tr>
<tr><td>12 Dec 2026</td><td>11 Mar 2027</td><td><b>11 Mar 2027</b></td><td><b>11 Mar 2027</b></td></tr></table>
<div class="warn">notice 太晚发出时，+3 个月会晚于 31 Oct —— 这时纸质和线上都是 notice+3M，别死记 31 Oct。</div>`},
 {t:'缴税时间表：POA 与 balancing payment',tag:'公式',b:`<table><tr><th>款项</th><th>日期</th><th>金额</th></tr>
<tr><td>1st POA（税年内）</td><td>31 Jan 2026</td><td>½ ×（24/25 income tax payable + 24/25 Class 4 NIC）</td></tr>
<tr><td>2nd POA</td><td>31 Jul 2026</td><td>同上，½</td></tr>
<tr><td>Balancing payment</td><td>31 Jan 2027</td><td>25/26 IT payable + Class 4 − 两笔 POA</td></tr>
<tr><td>CGT</td><td>31 Jan 2027</td><td>单独全额，<b>不参与 POA</b></td></tr></table>
<div class="warn">两个坑：① POA 的基数是<b>自评应缴的 IT + Class 4</b>，要扣掉 PAYE 已扣；② <b>CGT 不算进 POA 基数</b>，只在 balancing payment 时补。</div>`},
 {t:'例题：Mike 的 POA',tag:'例题',b:`<p>24/25：IT 总计 £9,200（含 PAYE £3,200），Class 4 £1,900，CGT £4,800。</p>
<b>1st &amp; 2nd POA</b> = ½ ×（9,200 − 3,200 + 1,900）= ½ × 7,900 = <b>£3,950</b>
<div class="tip">CGT 4,800 完全不进这个式子。看到 CGT 就划掉。</div>`},
 {t:'例题：Janice 在 31/1/2027 要交多少',tag:'例题',b:`<p>25/26：IT 14,000（已扣 2,000）、Class 4 2,500、CGT 1,700。24/25 自评应缴 13,000（已在前两年各付 6,500）。</p>
<b>Balancing payment（31/1/2027）</b> = 14,000 − 2,000 + 2,500 + 1,700 − 13,000 = <b>£3,200</b><br>
<b>+ 26/27 的 1st POA</b> = ½ ×（12,000 + 2,500）= <b>£7,250</b><br>
<b>31/1/2027 合计支付 £10,450</b>
<div class="warn">这一天同时发生三件事：补上年差额 + 交今年第一笔 POA（+ 若适用，CGT）。题目问"total amount to be paid on 31 Jan"，三项要加全。</div>`},
 {t:'修改、查询（enquiry）与记录保存',tag:'考点',b:`<ul>
<li>纳税人自行修改：申报截止后 <b>12 个月</b>内</li>
<li>HMRC 修改申报：实际提交日 + <b>9 个月</b></li>
<li>Enquiry 窗口：按期申报 → 提交日 + 12 个月；逾期 → 实际提交日之后的那个 <b>quarter day + 12 个月</b>（quarter days：31 Jan / 30 Apr / 31 Jul / 31 Oct）</li>
<li>可发起 enquiry 的理由：怀疑少报、扣除不当、掌握其他信息、随机抽查</li>
<li>记录保存：<b>经营</b>者保存至 31 Jan 2032（2025/26）；<b>非经营</b>者保存至 <b>31 Jan 2028</b>；未保存罚最高 £3,000</li></ul>`},
 {t:'错误申报的罚则（按行为分级）',tag:'公式',b:`<table><tr><th>行为</th><th>最高（不披露）</th><th>主动披露最低</th><th>被动披露最低</th></tr>
<tr><td>Deliberate &amp; concealed 故意并隐瞒</td><td>100%</td><td>30%</td><td>50%</td></tr>
<tr><td>Deliberate not concealed 故意未隐瞒</td><td>70%</td><td>20%</td><td>35%</td></tr>
<tr><td>Careless 疏忽</td><td>30%</td><td>0%</td><td>15%</td></tr></table>
<p>罚金 = 比例 × <b>未缴税款</b>。</p>
<div class="tip">主动披露永远比被查出来轻 —— 这是道德题的送分点。</div>`},
 {t:'避税 vs 逃税 vs 单纯填错',tag:'考点',b:`<ul>
<li><b>Tax avoidance</b>：合法安排事务以减轻税负（立法允许的规划）</li>
<li><b>Tax evasion</b>：违法少缴（隐瞒收入、造假）→ 罚则按故意等级</li>
<li><b>Careless error</b>：无心之失，<b>既不是 avoidance 也不是 evasion</b>，可在 12 个月内修改，一般不罚</li></ul>
<div class="tip">课件那题：Jackie（5,000 填成 500）＝ 疏忽错误；Michelle（故意只报 5,000）＝ 逃税，最高 70%（若隐瞒则 100%）。</div>`}
]},
{t:'② Week 2｜三类所得、Personal Allowance、Gift Aid / Pension',pts:[
 {t:'应税所得的"三段式"结构（务必按这个格式答题）',tag:'公式',b:`<table><tr><th></th><th>NSI</th><th>SI</th><th>DI</th></tr>
<tr><td>Trading income</td><td>X</td><td></td><td></td></tr>
<tr><td>Employment income</td><td>X</td><td></td><td></td></tr>
<tr><td>Property income</td><td>X</td><td></td><td></td></tr>
<tr><td>Pension income</td><td>X</td><td></td><td></td></tr>
<tr><td>Transition profit</td><td>X</td><td></td><td></td></tr>
<tr><td>Savings（利息/gilts/债券）</td><td></td><td>X</td><td></td></tr>
<tr><td>Dividends</td><td></td><td></td><td>X</td></tr>
<tr><td><b>Total income</b></td><td>X</td><td>X</td><td>X</td></tr>
<tr><td>Less qualifying interest paid</td><td>(X)</td><td>(X)</td><td>(X)</td></tr>
<tr><td><b>Net income</b></td><td>X</td><td>X</td><td>X</td></tr>
<tr><td>Less personal allowance</td><td>(X)</td><td>(X)</td><td>(X)</td></tr>
<tr><td><b>Taxable income</b></td><td>X</td><td>X</td><td>X</td></tr></table>
<div class="warn">PA 的抵减顺序：<b>先抵 NSI，再抵 SI，最后抵 DI</b>。这个顺序决定了后面 band 的分配，错了整题连坐。</div>`},
 {t:'储蓄所得的范围与 Accrued Income Scheme',tag:'公式',b:`<ul>
<li>银行利息、building society 利息、gilts（国债）、corporate bonds、NS&amp;I 利息</li>
<li><b>Gilt 中途转让</b>时价款里含"应计利息"：</li></ul>
<table><tr><th>主体</th><th>应税储蓄所得</th></tr>
<tr><td>卖方</td><td>已收利息 + 应计利息（nominal × 利率 × n/12）</td></tr>
<tr><td>买方</td><td>已收利息 − 卖方的应计利息</td></tr></table>
<div class="tip">课件例题：nominal £120,000、2.5%，7/1 买入 12/1 卖出 → 应计 120,000×2.5%×<b>5/12</b> = £1,250（卖方）；买方 = 1,500 − 1,250 = £250。月份数按持有月数算，买卖当月不计。</div>`},
 {t:'免税所得清单',tag:'考点',b:`<ul>
<li>赌博、彩票、Premium Bond 奖金</li>
<li>奖学金（scholarships）</li>
<li>地方政府补助（local authority grant）</li>
<li>法定遣散费（statutory redundancy pay）</li>
<li>Child benefit</li>
<li>NS&amp;I Savings Certificates 的利息；<b>ISA 内的利息、股息和资本利得全部免税</b></li></ul>
<div class="warn">Statutory redundancy 免税，但<b>合同约定的额外遣散费</b>不免（前面 £30,000 那套规则）。</div>`},
 {t:'ISA 额度与"取出来还能不能再存"',tag:'易错',b:`<ul>
<li>年度总额 <b>£20,000</b>（cash ISA + stocks &amp; shares 合并计算）</li>
<li>当年取出的钱<b>不会</b>恢复额度（不是循环额度）</li>
</ul>
<p>Example：存 10,000 后取 2,000 → 还能存 20,000 − (10,000 − 2,000) = <b>£12,000</b></p>
<div class="warn">注意这里为什么减 8,000：额度看的是"净存入"，取出会减少已用额度。别把 £20,000 直接减 10,000。</div>`},
 {t:'Qualifying interest paid（可扣除的利息）',tag:'考点',b:`<p>只有<b>特定用途</b>的借款利息才允许从收入中扣除，常见四类：</p>
<table><tr><th>借款用来做什么</th><th>英文</th></tr>
<tr><td>购买用于<b>合伙或雇佣</b>的厂房机器设备</td><td>plant &amp; machinery used for partnership / employment</td></tr>
<tr><td>投资合伙企业（出资）</td><td>investment in a partnership</td></tr>
<tr><td>购买 employee-controlled company 的股份</td><td>shares in an employee-controlled company</td></tr>
<tr><td>投资合作社</td><td>investment in a co-operative</td></tr></table>
<p><b>两个限制</b>：① 扣除额有上限——一般取 £50,000 与「相关收入 25%」中的较高者；② 只算借款期间、且在用途存续期间的利息（钱还清了就不再扣）。</p>
<div class="warn">别和自住房按揭混：自住房贷款利息<b>不是扣除项</b>，它是 tax reducer（按 20% 直接减税额），路径完全不同。</div>`},
 {t:'Personal Allowance 与 ANI（核心）',tag:'公式',b:`<ul>
<li>正常 PA = <b>£12,570</b></li>
<li><b>ANI</b> = total net income − gross personal pension contributions − gross gift aid donations</li>
<li>ANI &gt; £100,000 → PA 减少 ½ ×（ANI − 100,000）</li>
<li>ANI ≥ <b>£125,140</b> → PA = 0</li></ul>
<p>课件例：trading 102,000 + 利息 4,000 → ANI 106,000 → PA = 12,570 − ½×6,000 = <b>£9,570</b></p>
<div class="warn">顺序：<b>先 gross up → 算 ANI → 定 PA → 再算 taxable income</b>。很多人先减 PA 再算 ANI，全错。</div>`},
 {t:'Gift Aid 与个人养老金：gross up + 扩展税率带',tag:'公式',b:`<ul>
<li>Net 支付 × <b>100/80</b> = gross（视为已扣 20% 基础税率）</li>
<li>两件事同时发生：</li></ul>
<p>① <b>ANI 扣减</b>：gross 金额从 net income 里扣除（可能救回 PA）<br>
② <b>扩展税率带</b>：basic band 37,700 与 higher limit 125,140 <b>同时</b>加上 gross 金额</p>
<table><tr><th></th><th>正常</th><th>gross 52,000 后</th></tr>
<tr><td>Basic rate band</td><td>37,700</td><td>89,700</td></tr>
<tr><td>Higher rate limit</td><td>125,140</td><td>177,140</td></tr></table>
<div class="tip">捐款对慈善机构的价值：net 960 → 机构向 HMRC 取回 240，实得 1,200。对纳税人：higher rate 省 20%×1,200 = 240；additional 省 25%×1,200 = 300。</div>`},
 {t:'例题：Daisy（PA 被 taper）',tag:'例题',b:`<p>Salary 6,000 + 利息 4,000 + 股息 96,000 → total 106,000</p>
ANI = 106,000 → PA = 12,570 − ½×6,000 = <b>9,570</b><br>
PA 抵减：NSI 6,000 全抵 → 剩 3,570 抵 SI → SI 剩 430；DI 不抵
<table><tr><th></th><th>NSI</th><th>SI</th><th>DI</th></tr>
<tr><td>Total</td><td>6,000</td><td>4,000</td><td>96,000</td></tr>
<tr><td>Less PA</td><td>(6,000)</td><td>(3,570)</td><td>(0)</td></tr>
<tr><td>Taxable</td><td>0</td><td><b>430</b></td><td><b>96,000</b></td></tr></table>`}
]},
{t:'③ Week 3｜税额计算与三个 nil rate band（考试主战场）',pts:[
 {t:'纳税人身份判定',tag:'框架',b:`<table><tr><th>身份</th><th>条件</th><th>PSA</th></tr>
<tr><td>Basic rate taxpayer</td><td>total taxable income ≤ 37,700</td><td>£1,000</td></tr>
<tr><td>Higher rate taxpayer</td><td>37,700 &lt; income ≤ 125,140</td><td>£500</td></tr>
<tr><td>Additional rate taxpayer</td><td>&gt; 125,140</td><td>£0</td></tr></table>
<div class="warn">身份按<b>全部应税所得</b>（含股息）判断，不是只看工资。发了大额股息的人很容易被推到 higher rate。</div>`},
 {t:'2025/26 税率总表',tag:'公式',b:`<table><tr><th>Band</th><th>NSI</th><th>SI</th><th>DI</th></tr>
<tr><td>Savings starting rate（£5,000）</td><td>—</td><td><b>0%</b></td><td>—</td></tr>
<tr><td>Nil rate band</td><td>—</td><td>PSA 0%（1,000 / 500 / 0）</td><td>£500 全员 0%</td></tr>
<tr><td>Basic（£37,700）</td><td>20%</td><td>20%</td><td>8.75%</td></tr>
<tr><td>Higher（£125,140）</td><td>40%</td><td>40%</td><td>33.75%</td></tr>
<tr><td>Additional</td><td>45%</td><td>45%</td><td>39.35%</td></tr></table>
<div class="tip">三个 0% 都不免税，它们<b>占 band</b>——占完的地方后面要按更高税率交。这是 Week 3 全部的难点。</div>`},
 {t:'Savings starting rate £5,000 怎么用',tag:'易错',b:`<ul>
<li>只有 <b>NSI &lt; £5,000</b> 时才有额度，额度 = <b>5,000 − NSI</b></li>
<li>用在储蓄所得最前面，0%</li>
<li>顺序：starting rate → PSA → basic 20%</li></ul>
<div class="warn">NSI = 2,000 时，starting rate 只剩 3,000；NSI = 6,000 时直接没有。别忘这一步，否则 savings 全按 20% 算。</div>`},
 {t:'完整算税模板（照抄这个竖式）',tag:'公式',b:`<table><tr><th>项目</th><th>£</th></tr>
<tr><td><b>NSI</b></td><td></td></tr>
<tr><td>Basic band × 20%</td><td>X</td></tr>
<tr><td>Higher band × 40%</td><td>X</td></tr>
<tr><td>Additional × 45%</td><td>X</td></tr>
<tr><td><b>SI</b></td><td></td></tr>
<tr><td>Starting rate × 0%</td><td>0</td></tr>
<tr><td>Nil rate band × 0%</td><td>0</td></tr>
<tr><td>Basic × 20% / Higher × 40% / Additional × 45%</td><td>X</td></tr>
<tr><td><b>DI</b></td><td></td></tr>
<tr><td>Nil band × 0%</td><td>0</td></tr>
<tr><td>Basic × 8.75% / Higher × 33.75% / Additional × 39.35%</td><td>X</td></tr>
<tr><td><b>Total</b></td><td>X</td></tr>
<tr><td>Less tax reducers（marriage allowance 等）</td><td>(X)</td></tr>
<tr><td><b>Income tax liability</b></td><td>X</td></tr>
<tr><td>Less PAYE / tax deducted</td><td>(X)</td></tr>
<tr><td><b>Tax payable</b></td><td>X</td></tr></table>`},
 {t:'例题 1：Polly（三档叠加，逐段拆）',tag:'例题',b:`<p>Taxable：NSI 2,000 / SI 10,000 / DI 40,000（PA 已扣）</p>
<table><tr><th>段</th><th>计算</th><th>£</th></tr>
<tr><td>NSI 2,000</td><td>2,000 × 20%</td><td>400</td></tr>
<tr><td>SI 前 3,000</td><td>starting rate（5,000 − 2,000）× 0%</td><td>0</td></tr>
<tr><td>SI 再 1,000</td><td>PSA × 0%（basic 身份）</td><td>0</td></tr>
<tr><td>SI 剩 6,000</td><td>6,000 × 20%</td><td>1,200</td></tr>
<tr><td>DI 前 500</td><td>nil band × 0%</td><td>0</td></tr>
<tr><td>DI 25,200</td><td>basic band 剩余 × 8.75%</td><td>2,205</td></tr>
<tr><td>DI 剩 14,300</td><td>× 33.75%</td><td>4,826.25</td></tr>
<tr><td><b>合计</b></td><td></td><td><b>8,631.25</b></td></tr></table>
<p>Band 校验：2,000 + 3,000 + 1,000 + 6,000 + 500 + 25,200 = <b>37,700</b> ✓</p>
<div class="warn">课件这题给了两个答案（£8,731 和 £8,875），两个都漏了 £1,000 PSA（8,875 那版还漏了股息 £500 nil band）。按 HMRC 全规则应为 <b>£8,631.25</b>；考试时建议按老师的口径写，但课下问一句更稳。</div>`},
 {t:'例题 3：May（PA taper + band 扩展双管齐下）',tag:'例题',b:`<p>Trading profit 159,000；net pension 32,000；net gift aid 9,600</p>
<b>Gross up</b>：pension 32,000/0.8 = 40,000；gift aid 9,600/0.8 = 12,000；合计 52,000<br>
<b>ANI</b> = 159,000 − 52,000 = 107,000 → PA = 12,570 − ½×7,000 = <b>9,070</b><br>
<b>Taxable</b> = 159,000 − 9,070 = <b>149,930</b><br>
<b>Band</b>：basic 37,700 + 52,000 = <b>89,700</b>；higher limit 125,140 + 52,000 = <b>177,140</b>
<table><tr><td>89,700 × 20%</td><td>17,940</td></tr>
<tr><td>(149,930 − 89,700) × 40%</td><td>24,092</td></tr>
<tr><td><b>合计</b></td><td><b>42,032</b></td></tr></table>
<div class="tip">一个 donation 干两件事：救 PA（提高 ANI 分母那一侧的扣除）+ 扩 band。两个都要写，缺一个就少 5 分。</div>`},
 {t:'Marriage allowance（可转移 £1,260）',tag:'考点',b:`<ul>
<li>配偶一方可把 <b>£1,260</b> 的 PA 转给另一方（受让方须为 basic rate）</li>
<li>受让方获得 <b>tax reducer £252</b>（= 1,260 × 20%），直接减税额，不是减所得</li>
<li>转让方 PA 变 11,310</li></ul>
<p>课件例：David 交易所得 10,000，Victoria 工资 30,500</p>
<table><tr><th></th><th>David</th><th>Victoria</th></tr>
<tr><td>收入</td><td>10,000</td><td>30,500</td></tr>
<tr><td>Less PA</td><td>(11,310)</td><td>(12,570)</td></tr>
<tr><td>Taxable</td><td>Nil</td><td>17,930</td></tr>
<tr><td>Tax</td><td>0</td><td>17,930 × 20% = 3,586</td></tr>
<tr><td>Less reducer</td><td>—</td><td>(252)</td></tr>
<tr><td><b>Liability</b></td><td>0</td><td><b>3,334</b></td></tr></table>
<div class="warn">PA 不能把收入减成负数，多出的部分浪费（David 的 1,310 就白扔了）—— 所以转移对"低收入一方"更划算。</div>`}
]},
{t:'④ 作业解答（Week 1–3）',pts:[
 {t:'Homework（Week 3）1：Alice',tag:'例题',b:`<p>Salary 46,500；savings 2,000；dividend 6,000；qualifying interest 300</p>
<table><tr><th></th><th>NSI</th><th>SI</th><th>DI</th></tr>
<tr><td>Income</td><td>46,500</td><td>2,000</td><td>6,000</td></tr>
<tr><td>Less interest paid</td><td>(300)</td><td>—</td><td>—</td></tr>
<tr><td>Net income</td><td>46,200</td><td>2,000</td><td>6,000</td></tr>
<tr><td>Less PA 12,570</td><td>(12,570)</td><td>—</td><td>—</td></tr>
<tr><td><b>Taxable</b></td><td><b>33,630</b></td><td><b>2,000</b></td><td><b>6,000</b></td></tr></table>
ANI = 54,200 &lt; 100,000 → 全额 PA，无 restriction<br>
<b>Tax</b>：NSI 33,630 × 20% = 6,726<br>
SI：无 starting rate（NSI &gt; 5,000）→ PSA 1,000 × 0% + 1,000 × 20% = 200<br>
DI：剩 band 2,070 → 500 × 0% + 1,570 × 8.75% = 137.38，余 3,930 × 33.75% = 1,326.38<br>
<b>合计 ≈ £8,389.75</b>（约 £8,390）`},
 {t:'Homework（Week 3）2：Ken',tag:'例题',b:`<p>Employment 111,400；gift aid gross 800</p>
<b>(1) 2025/26</b><br>
ANI = 111,400 − 800 = 110,600 → 超出 10,600 → PA = 12,570 − 5,300 = <b>7,270</b><br>
Taxable = 111,400 − 7,270 = <b>104,130</b>；basic band 37,700 + 800 = <b>38,500</b><br>
Tax = 38,500 × 20% = 7,700 + (104,130 − 38,500) × 40% = 26,252 → <b>£33,952</b>
<hr>
<b>(2) 再捐 gross 10,600（累计 gross 11,400）</b><br>
ANI = 111,400 − 11,400 = <b>100,000</b> → 未超过 → PA 全额 <b>12,570</b><br>
Taxable = 98,830；basic band = 37,700 + 11,400 = <b>49,100</b><br>
Tax = 49,100 × 20% = 9,820 + 49,730 × 40% = 19,892 → <b>£29,712</b><br>
<b>节省 £4,240</b>（= 10,600 × 40%，正好是 higher rate 的全额减免，因为他还在 higher band 内）`},
 {t:'Week 1 作业：Mike / 税种分类 / 罚则',tag:'例题',b:`<ul>
<li>POA = ½ ×（9,200 − 3,200 + 1,900）= <b>£3,950</b>（CGT 不算）</li>
<li>税种分类：sole trader 利润 → IT + NIC（direct）；公司利润 → CT + NIC（direct）；卖古董桌 → CGT（direct）；采购原材料 → VAT（indirect）；公司卖厂房 → CT on chargeable gains（direct）；遗产 → IHT（direct）</li>
<li>capital / revenue：VAT = neither、IHT = capital、NIC = revenue</li>
<li>Jackie（误填）→ 非避税非逃税，12 个月内可改；Michelle（故意少报）→ 逃税，最高 70%（隐瞒则 100%）</li>
<li>Amy：notice 25/4/2026 → 线上截止 <b>31/1/2027</b>；实际 1/3/2027 逾期提交 → enquiry 窗口至 <b>30/4/2028</b>（其后 quarter day + 12 个月）；非经营记录保存至 <b>31/1/2028</b></li></ul>`}
]},
{t:'⑤ Week 4｜Employment Income①（工资 · 奖金 · 里程 · 可扣费用）',pts:[
 {t:'Employment vs Self-employment：六条判据',tag:'考点',b:`<p>下面六条都成立 → 更像 <b>employee</b>：</p>
<ul>
<li>不自己提供设备（does not provide his own equipment）</li>
<li>不能雇助手，必须亲自干活</li>
<li>不能从「良好的管理」中获利（cannot profit from sound management）——赚多赚少是老板的</li>
<li>不承担财务风险（no financial risk）</li>
<li>一般不能拒绝被派来的工作（cannot decline work when offered）</li>
<li>享受病假工资与带薪假期（sick pay / holiday pay）</li></ul>
<div class="tip">答题时把六条一条条往事实上套，再说整体印象。有一条不符不致命。</div>`},
 {t:'Pro-forma：Employment income 怎么算',tag:'公式',b:`<table><tr><th>£</th><th></th></tr>
<tr><td>Salary</td><td>X</td></tr>
<tr><td>Bonus</td><td>X</td></tr>
<tr><td>Commission / tips</td><td>X</td></tr>
<tr><td>Benefits in kind</td><td>X</td></tr>
<tr><td>Less: allowable deductions</td><td>(X)</td></tr>
<tr><td><b>Employment income</b></td><td><b>X</b></td></tr></table>
<div class="warn">tips / gratuity 是<b>应税</b>的，客户直接塞给的钱也要放进 commission / tips 那一行。不是老板发的也算。</div>`},
 {t:'Bonus 什么时候算「收到」',tag:'考点',b:`<p><b>一般雇员</b>：取较早者——① 实际支付日；② 取得收款权利日（entitled to payment）。</p>
<p><b>董事（director）</b>：取下面三者中<b>最早</b>：</p>
<ol><li>上面一般规则里的较早者</li>
<li>金额<b>记入公司账簿</b>（credited in the company's accounting records）之日</li>
<li><b>later of</b>：会计期间结束日／金额被确定（determined）之日</li></ol>
<div class="tip">第 3 条本身是「两个日期取晚者」，再跟前两个比取最早。董事常常在「记账那天」就被征税，哪怕钱还没到手、还带着条件。</div>`},
 {t:'例题 1：Josephine 的董事奖金算哪一年',tag:'例题',b:`<p>Diamond plc 年结 31 March，奖金 £5,000：</p>
<table><tr><th>事件</th><th>日期</th></tr>
<tr><td>董事们确定金额</td><td>28 Feb 2026</td></tr>
<tr><td>记入 director's account</td><td>10 Mar 2026</td></tr>
<tr><td>可提取（entitled）</td><td>15 Apr 2026</td></tr>
<tr><td>实际支付</td><td>28 Apr 2026</td></tr></table>
<p><b>答</b>：她是董事，三个候选（10 Mar / 15 Apr / 28 Apr）里最早是记账日 <b>10 March 2026</b> → 落在 <b>2025/26</b>。</p>
<div class="warn">「later of 期末 31 Mar 2026 / 确定日 28 Feb 2026」= 31 Mar 2026，比 10 Mar 晚，所以不选。答题就把候选日期全列出来划最早的那个。</div>`},
 {t:'Approved mileage allowance：45p / 25p',tag:'公式',b:`<p>2025/26：前 <b>10,000</b> business miles 每英里 <b>45p</b>，之后每英里 <b>25p</b>。</p>
<table><tr><th>情形</th><th>处理</th></tr>
<tr><td>报销 ≤ 法定标准</td><td>报销款<b>免税</b>，没有调整</td></tr>
<tr><td>报销 &gt; 法定标准</td><td>超出部分<b>应税</b>（作为 earnings）</td></tr>
<tr><td>没报销／报销不足</td><td>可主张 allowable deduction = 法定里程额 − 已收报销</td></tr></table>
<div class="warn">① 只有 <b>business miles</b> 进这个阶梯，通勤不算；② 阶梯是<b>按税年累计</b>，不是按每趟；③ 报销超过法定额时没有「负扣除」，只能加回应税收入。</div>`},
 {t:'例题 2：Kerry（自用车，超标准报销）',tag:'例题',b:`<p>1,800cc 自用车，2025/26 公务 12,000 miles，雇主按 30p/mile 付。</p>
<table><tr><th>£</th><th></th></tr>
<tr><td>10,000 × 45p</td><td>4,500</td></tr>
<tr><td>2,000 × 25p</td><td>500</td></tr>
<tr><td>法定里程额</td><td><b>5,000</b></td></tr>
<tr><td>减：雇主支付 12,000 × 30p</td><td>(3,600)</td></tr>
<tr><td><b>Allowable deduction</b></td><td><b>1,400</b></td></tr></table>
<div class="warn">课件那行写成「1,200 × 30p」是笔误，12,000 × 30p = <b>3,600</b>，5,000 − 3,600 = 1,400。别跟着抄错。</div>`},
 {t:'Travel expenses：三个地点，两种结论',tag:'考点',b:`<table><tr><th>路线</th><th>能否扣</th></tr>
<tr><td>Home → <b>Permanent</b> workplace（日常通勤）</td><td><b>不可扣</b>（私人性质）</td></tr>
<tr><td>Home → <b>Temporary</b> workplace（少于 24 个月）</td><td><b>可扣</b></td></tr>
<tr><td>Permanent workplace → 客户／其他工作地点</td><td><b>可扣</b></td></tr></table>
<div class="tip">口诀：<b>通勤不扣，跑外勤扣，临时工地扣</b>。temporary 看同一地点是否连续超过 24 个月。</div>`},
 {t:'例题 3：Kim（先剔通勤再走阶梯）',tag:'例题',b:`<p>2025/26（1 Jun – 5 Apr）自用车，雇主一分没报销：</p>
<table><tr><th>行程</th><th>miles</th><th>处理</th></tr>
<tr><td>Home ↔ permanent workplace</td><td>3,400</td><td>不算</td></tr>
<tr><td>Permanent workplace ↔ customers</td><td>11,200</td><td>算</td></tr>
<tr><td>Home ↔ temporary workplace（&lt;24 个月）</td><td>1,300</td><td>算</td></tr>
<tr><td><b>Business miles 合计</b></td><td><b>12,500</b></td><td></td></tr></table>
<table><tr><th>£</th><th></th></tr>
<tr><td>雇主报销</td><td>0</td></tr>
<tr><td>10,000 × 45p</td><td>4,500</td></tr>
<tr><td>2,500 × 25p</td><td>625</td></tr>
<tr><td><b>Allowable deduction</b></td><td><b>5,125</b></td></tr></table>
<div class="warn">第一步永远先把 3,400 通勤踢掉，再拿 12,500 走阶梯。直接拿 15,900 算就全错。</div>`},
 {t:'可扣除费用清单（背这几条）',tag:'考点',b:`<p>总原则：<b>wholly, exclusively and necessarily</b> 为履行职务而花的才可扣；带私人好处的不可扣。</p>
<table><tr><th>项目</th><th>结论</th></tr>
<tr><td>工作穿的衣服（含工作服）</td><td><b>不可扣</b></td></tr>
<tr><td>向 approved occupational pension scheme 缴款</td><td>可扣</td></tr>
<tr><td>工资扣除式捐赠（payroll deduction）</td><td>可扣</td></tr>
<tr><td>与职务相关的专业团体年费（subscription to professional bodies）</td><td>可扣</td></tr>
<tr><td>自用车的法定 business mileage 额</td><td>可扣</td></tr></table>
<div class="warn">「necessarily」是最狠的词：不是「上班需要」，而是「这份职务逼着你必须花」。所以西装、通勤都不行。</div>`},
 {t:'Homework 1：John 的 15,400 miles',tag:'作业',b:`<p>法定额 = 10,000 × 45p + 5,400 × 25p = 4,500 + 1,350 = <b>£5,850</b></p>
<p><b>(1) 40p/mile</b>：实收 15,400 × 40p = £6,160 → 6,160 − 5,850 = <b>£310 应税</b>（超出法定标准的部分作为 earnings 征税）。</p>
<p><b>(2) 25p/mile</b>：实收 15,400 × 25p = £3,850 → 5,850 − 3,850 = <b>£2,000 allowable deduction</b>。</p>
<div class="tip">模板：先算法定额 → 再算实收 → 相减。实收多写「应税 X」，实收少写「可扣 X」。</div>`},
 {t:'Homework 2：Judy 的 employment income',tag:'作业',b:`<table><tr><th>£</th><th></th></tr>
<tr><td>Salary</td><td>18,000</td></tr>
<tr><td>Bonus（30 Sep 2025 实收，属 2025/26）</td><td>4,000</td></tr>
<tr><td>Gratuity（客户 1 Dec 2025 给的小费，应税）</td><td>500</td></tr>
<tr><td><b>Employment income 2025/26</b></td><td><b>22,500</b></td></tr></table>
<div class="warn">那笔 2026 年 9 月才发的 £4,800 是<b>预期</b>，2025/26 一分不算（receipts basis）。bonus 看「什么时候收到」而不是「业绩属于哪一年」——业绩是 year ended 31 Mar 2025，但 30 Sep 2025 才收到，就落在 2025/26。</div>`}
]},
{t:'⑥ Week 9–10｜Self-employment & Basis period（预习 · 已写细）',pts:[
 {t:'这一章到底在算什么（先看全局）',tag:'框架',b:`<p>自雇（sole trader）没有工资单，所以要自己把<b>会计利润</b>换算成<b>税务口径的营业利润</b>，再并进 total income 交 income tax + Class 4 NIC。</p>
<p>做题顺序固定四步，一步都不能跳：</p>
<table><tr><th>Step</th><th>做什么</th><th>英文</th></tr>
<tr><td>1</td><td>拿会计净利润（profit before tax per accounts）</td><td>accounting profit</td></tr>
<tr><td>2</td><td>加回不可扣支出、扣掉非营业收入 → 税务调整后利润</td><td>tax adjusted trading profit</td></tr>
<tr><td>3</td><td>再减 capital allowances（资本减免）</td><td>capital allowances</td></tr>
<tr><td>4</td><td>按 basis period 规则，落到「本税年确认多少」</td><td>basis of assessment</td></tr></table>
<div class="tip">题目给的 profit before tax 永远不是答案。看到 depreciation、private use、capital 这三个词，就要开始调了。</div>`},
 {t:'调增：会计上扣了、税上不许扣的项目',tag:'考点',b:`<table><tr><th>项目</th><th>英文</th><th>为什么不让扣</th></tr>
<tr><td>折旧</td><td>depreciation</td><td>税上只认 capital allowances，不能双重</td></tr>
<tr><td>资本性支出</td><td>capital expenditure</td><td>不是 revenue 性质（买设备、改建、扩建）</td></tr>
<tr><td>私人用途部分</td><td>private use</td><td>不满足 wholly &amp; exclusively for the trade</td></tr>
<tr><td>招待客户</td><td>business entertaining</td><td>英国税法一律不认（员工食堂属例外）</td></tr>
<tr><td>礼品</td><td>gifts</td><td>除非有明显广告标识且单价很低</td></tr>
<tr><td>罚款、罚金</td><td>fines / penalties</td><td>违法行为的成本不予扣除</td></tr>
<tr><td>一般性坏账准备</td><td>general provision</td><td>不是已确定的负债（呼应 IAS 37）</td></tr>
<tr><td>所得税、NIC</td><td>income tax / NIC</td><td>税本身不能当费用</td></tr></table>
<div class="warn">易混：<b>specific provision</b> 与 <b>bad debt written off</b> 可扣，<b>general provision</b> 不可扣。题目写「provision for doubtful debts」一定要看清是 general 还是 specific。</div>`},
 {t:'调减：进了利润、但不是营业所得',tag:'公式',b:`<table><tr><th>项目</th><th>处理</th></tr>
<tr><td>银行利息、股息</td><td>扣掉 → 走 savings / dividend，不在营业利润里征</td></tr>
<tr><td>租金收入</td><td>扣掉 → 走 property income</td></tr>
<tr><td>出售固定资产的利润</td><td>扣掉 → 走 CGT</td></tr>
<tr><td>自己给自己开的工资</td><td>不存在；sole trader 的 drawings 不是费用</td></tr></table>
<div class="tip">调减项一般只有一两个，藏在十几个调增里。先把 income 侧扫一遍：利息、租金、卖资产。</div>`},
 {t:'Capital allowances：三个池子，两种减免',tag:'公式',b:`<table><tr><th>工具</th><th>适用范围</th><th>2025/26 金额</th></tr>
<tr><td><b>AIA</b>（Annual Investment Allowance）</td><td>plant &amp; machinery，<b>不含汽车</b></td><td>£1,000,000 一次性全额扣</td></tr>
<tr><td><b>WDA 18%</b>（main pool）</td><td>一般设备，余额递减</td><td>余额 × 18%</td></tr>
<tr><td><b>WDA 6%</b>（special rate pool）</td><td>integral features（暖气、电梯、照明）、long-life assets、高排放汽车</td><td>余额 × 6%</td></tr>
<tr><td>零排放汽车</td><td>新车</td><td>100% FYA（以教材当年规定为准）</td></tr>
<tr><td>小额余额</td><td>pool 余额 ≤ £1,000</td><td>全额扣（small pool allowance）</td></tr></table>
<p>顺序永远是：<b>先给 AIA，再对剩下的余额算 WDA</b>。</p>
<div class="warn">① 汽车不能用 AIA；② 有私用比例时，CA 要按 business use % 折算，私用部分不给；③ 卖资产时把卖价从池子里扣，可能出现 balancing charge（要交税）或 balancing allowance。</div>`},
 {t:'Basis period：2024/25 起改成 tax year basis',tag:'考点',b:`<p>现在每个税年征的是<b>该税年内（6 Apr – 5 Apr）实际赚到的利润</b>，不再用「以会计期间结尾」的老规则。</p>
<p>所以会计期不是 4 月 5 日结束的，就要按<b>天数分摊（time apportionment）</b>，把跨年的两个会计期切成一个税年。</p>
<div class="tip">例题给「year ended 31 December」，就把 2025 期和 2026 期按天数切，拼满 6 Apr 2025 – 5 Apr 2026。天数用题目给的，别自己估。</div>
<div class="warn">2023/24 的过渡期额外利润叫 <b>transitional profits</b>，分 5 年摊。这类题只需知道有这回事，不要写进常规计算。</div>`},
 {t:'Trading losses：五种出口，顺序要分清',tag:'考点',b:`<table><tr><th>情形</th><th>能抵什么</th><th>英文</th></tr>
<tr><td>当年、同行业</td><td>可抵其他收入甚至资本利得</td><td>current year loss relief</td></tr>
<tr><td>开业头 4 年</td><td>往前抵 3 年的 total income</td><td>early trade losses relief</td></tr>
<tr><td>一般结转</td><td>往后抵<b>同一 trade</b> 的未来利润（无期限）</td><td>carry forward (CARF)</td></tr>
<tr><td>停业最后 12 个月</td><td>往前抵 3 年、同行业</td><td>terminal loss relief</td></tr>
<tr><td>抵资本利得</td><td>开业初期可扩到 chargeable gains</td><td>offset against CGT</td></tr></table>
<div class="warn">最常错：<b>carry forward 只能抵同一 trade 的利润</b>，不能拿去抵工资或租金；能抵 total income 的是 current year / early years 那两种。</div>`},
 {t:'Class 4 NIC 与 Payments on Account 的联动',tag:'公式',b:`<ul><li>利润 £12,570 – £50,270 之间：<b>6%</b></li>
<li>超过 £50,270：<b>2%</b></li></ul>
<p>Class 4 会进 POA 的基数——这就是 Week 1 公式里「IT + Class 4」的由来。</p>
<div class="tip">顺序：先算 income tax liability（含 PA、dividend 特殊税率），再单独算 Class 4，两者相加才是总额。</div>`}
]},
{t:'⑦ Week 11｜NIC（预习 · 已写细）',pts:[
 {t:'六类 NIC 一页分清',tag:'框架',b:`<table><tr><th>Class</th><th>谁交</th><th>对什么征</th><th>2025/26 税率</th></tr>
<tr><td>Class 1 primary</td><td>雇员</td><td>工资</td><td>8% / 2%</td></tr>
<tr><td>Class 1 secondary</td><td>雇主</td><td>工资</td><td>15%（超过 ST £5,000）</td></tr>
<tr><td>Class 1A</td><td>雇主</td><td>benefits in kind</td><td>15%</td></tr>
<tr><td>Class 2</td><td>自雇</td><td>固定额（已并入，实务上视为已缴）</td><td>—</td></tr>
<tr><td>Class 3</td><td>自愿补缴</td><td>补足记录</td><td>—</td></tr>
<tr><td>Class 4</td><td>自雇</td><td>利润</td><td>6% / 2%</td></tr></table>
<div class="tip">考试只考 Class 1 primary、Class 1 secondary、Class 1A、Class 4 这四类，其他知道名字就行。</div>`},
 {t:'Class 1 雇员：两段式算法',tag:'公式',b:`<p>门槛：<b>PT（Primary Threshold）£12,570</b>、<b>UEL（Upper Earnings Limit）£50,270</b>。</p>
<table><tr><th>区间</th><th>税率</th></tr>
<tr><td>£0 – £12,570</td><td>0%</td></tr>
<tr><td>£12,570 – £50,270</td><td><b>8%</b></td></tr>
<tr><td>超过 £50,270</td><td><b>2%</b></td></tr></table>
<p><b>例：年薪 £60,000</b><br>(50,270 − 12,570) × 8% = 3,016<br>(60,000 − 50,270) × 2% = 194.6<br>合计 <b>£3,210.60</b></p>
<div class="warn">PT 和 PA（12,570）数字一样但含义不同：PA 是所得税的免征额，PT 是 NIC 的门槛。别因为数字相同就当同一件事。</div>`},
 {t:'Class 1 雇主：15%，还有 Employment Allowance',tag:'公式',b:`<p>雇主部分叫 <b>secondary contribution</b>，从 <b>ST（Secondary Threshold）£5,000</b> 起征，税率 <b>15%</b>。</p>
<p><b>例：年薪 £60,000</b><br>(60,000 − 5,000) × 15% = <b>£8,250</b></p>
<p>符合条件的小雇主可用 <b>Employment Allowance</b> 抵掉一部分（以教材当年额度为准）。</p>
<div class="tip">答题时两段分开写：primary 归雇员、secondary 归雇主。题目问「total NIC cost to the employer」= secondary + Class 1A，不含 primary。</div>`},
 {t:'Class 1A：对福利征，随 P11D 走',tag:'考点',b:`<ul><li>对 <b>benefits in kind</b>（公司车、燃油、无息贷款等）按 <b>15%</b> 征</li>
<li>由<b>雇主</b>承担，不是雇员</li>
<li>每年 <b>6 July</b> 前报 P11D，<b>19 July</b> 前缴款（电子申报 22 July）</li></ul>
<div class="tip">福利本身的价值算雇员的 employment income（应税），Class 1A 是雇主另外再交一笔——两头都收，别以为交过 Class 1A 雇员就不用交税。</div>`},
 {t:'Class 4：自雇按利润征，和 Class 1 完全两套',tag:'公式',b:`<table><tr><th>区间</th><th>税率</th></tr>
<tr><td>£0 – £12,570</td><td>0%</td></tr>
<tr><td>£12,570 – £50,270</td><td><b>6%</b></td></tr>
<tr><td>超过 £50,270</td><td><b>2%</b></td></tr></table>
<p><b>例：tax adjusted profit £40,000</b><br>(40,000 − 12,570) × 6% = <b>£1,645.80</b></p>
<div class="warn">Class 4 的基数是<b>税务调整后利润</b>（已减 capital allowances），不是会计利润。顺序搞错整题都错。</div>`},
 {t:'NIC 三个最容易翻车的点',tag:'易错',b:`<ol><li><b>按发薪期算</b>：Class 1 是每期工资各自算，不是全年汇总一次性算——月薪、周薪结果不同。</li>
<li><b>年度上限</b>：多份工作可以申请 deferral / 退还超缴部分，题目会提示。</li>
<li><b>NIC 不能抵扣所得税</b>：它是独立的一笔，和 income tax 并列，不是费用也不是扣除项。</li></ol>
<div class="tip">考前默一遍：PT 12,570 / UEL 50,270 / ST 5,000 / 8% – 2% – 15% – 6%。这五个数字撑起整章计算。</div>`}
]}
]}
,
{id:'law',name:'Global Corporate Business Law',desc:'GCBL · Week 1–4 已对齐（CISG + 商业组织）· 考试就是「三步法 + 条文号」',chapters:[
{t:'⓪ 先看这个：这门课的答题公式',pts:[
 {t:'三步法（老师要的格式，照抄）',tag:'公式',b:`<p><b>Legal issue</b>: Whether ……?</p>
<p><b>Step 1 — Explain the law</b><br>According to ______（条文 / 判例）……（把规则用自己的话讲清楚）</p>
<p><b>Step 2 — Apply</b><br>In this case, ……（把事实一条条塞进规则里）</p>
<p><b>Step 3 — Conclusion</b><br>Therefore, Yes / No ……</p>
<div class="tip">模板的价值：三段论保证你永远不空白。哪怕不会，写"issue + 相关条文 + 事实套用"就有分。这门课不是考你背判例，是考你能不能用条文把事实切成块。</div>`},
 {t:'三步法示范（用 Natural Gas 第 1 问）',tag:'案例',b:`<p><b>Issue</b>: Whether the buyer breached the contract by not obtaining the letter of credit?</p>
<p><b>Step 1</b>: According to <b>Article 80 CISG</b>, a party may not rely on a failure of the other party to perform, to the extent that such failure was caused by the first party's act or omission.</p>
<p><b>Step 2</b>: In this case, the buyer told the seller that its bank needed the place of loading before it could issue the letter of credit. The seller agreed to provide it but never did. The buyer's failure was therefore caused by the seller's own omission.</p>
<p><b>Step 3</b>: Therefore, the buyer did <b>not</b> breach the contract, and the seller cannot rely on that failure.</p>`},
 {t:'为什么整节课都在讲 Article 号',tag:'框架',b:`<ul>
<li>CISG 是<b>条约</b>，条文号就是你的法条依据，写 <b>Art 14</b> 比写"the Convention says"值钱</li>
<li>考试结构基本是：给事实 → 问是否构成 offer / 能否撤销 / 谁承担风险 → 你 cite 条文</li>
<li>所以要背的不是数字，而是<b>四组核心</b>：14/15/16/18（成立）、25/49（根本违约与解除）、30/35/53（义务）、66/67（风险）、74/77/80（赔偿）</li></ul>
<div class="warn">课件里有几处条文号写错，我标在后面的卡片里（例如"买方要求替代货物"是 <b>Art 46(2)</b>，不是 Art 29）。</div>`}
]},
{t:'① Week 1｜国际法基础：主体、渊源、三大流派',pts:[
 {t:'国际法 vs 国内法、公法 vs 私法',tag:'考点',b:`<ul>
<li><b>没有世界政府</b>：没有全球立法机关、没有统一执法机关 → 国际法是"平权、横向"的体系</li>
<li><b>Public international law</b>：国家与国家之间（条约、习惯、战争法）</li>
<li><b>Private international law</b>：私人之间的涉外争议，解决"用哪国法 / 哪国法院"（冲突法）</li>
<li>国际法调整三类关系：State–State、State–Person、Person–Person（涉外）</li></ul>`},
 {t:'谁能当国际法主体',tag:'考点',b:`<ul>
<li><b>States</b>：三要素——<b>territory</b>（领土）、<b>population</b>（人口）、<b>effective government</b>（有效政府）</li>
<li><b>IGOs</b>（政府间组织）：如联合国、WTO，有缔约、诉讼能力</li>
<li><b>NGOs</b>：有影响力但一般不是完整主体</li>
<li><b>Individuals</b>：有限主体（人权、投资仲裁；国家可为其国民行使外交保护）</li></ul>`},
 {t:'三大流派：谁在决定国际法',tag:'考点',b:`<table><tr><th>流派</th><th>核心主张</th></tr>
<tr><td><b>Cosmopolitans</b> 世界主义</td><td>存在普世人权，<b>国家同意与否不重要</b>（自然法）</td></tr>
<tr><td><b>Positivists</b> 实证主义</td><td>国际法＝国家间的一系列"合同"，<b>同意（consent）</b>才产生约束</td></tr>
<tr><td><b>Hobbesians</b> 霍布斯主义</td><td>国家只在<b>符合自身利益</b>时才缔约和遵守</td></tr></table>
<div class="tip">ICJ 规约第 38(1) 条体现的是<b>实证主义</b>（条约＝国家明示同意）。这是 Week 1 作业的原题。</div>`},
 {t:'国际法渊源：Article 38(1) of the ICJ Statute',tag:'公式',b:`<ol style="padding-left:18px">
<li><b>(a) 条约 / 公约</b>——明示承认的规则</li>
<li><b>(b) 习惯</b>——"general practice accepted as law"</li>
<li><b>(c) 一般法律原则</b>（文明国家承认的）</li>
<li><b>(d) 司法判决与公法学家学说</b>——<u>辅助</u>手段（受 Art 59 限制：判决只约束当事国）</li></ol>
<div class="warn">第 (d) 项不是主要渊源，答题时别把它和条约并列。同理，<b>comity（礼让）不是法</b>，只是国家间的礼貌。</div>`},
 {t:'Custom 的两要件（必考）',tag:'公式',b:`<ul>
<li><b>Usus（行为要件）</b>：consistent and recurring action。<b>不需要</b>时间久远、<b>不需要</b>所有国家都遵守，但需"相当数量主要国家"长期一致地实践</li>
<li><b>Opinio juris sive necessitatis（心理要件）</b>：国家认为<b>有义务</b>遵守，而非出于礼貌</li></ul>
<div class="tip">作业判断题的关键：题目说"必须所有国家遵守 / 必须历史悠久" → 错。这是 usus 的常见陷阱。</div>`},
 {t:'条约与公约的区别；Jus Cogens',tag:'考点',b:`<ul>
<li><b>Treaty</b>：国家间<b>书面</b>、受国际法支配的协议（VCLT Art 2(1)(a)）→ 口头约定<b>不算</b>条约</li>
<li><b>Convention</b>：由国际组织主持制定的多边条约</li>
<li><b>Jus cogens</b>：强行法，<b>不容克减</b>（禁止种族灭绝、禁止侵略等）→ 偏<b>自然法</b>思路</li>
<li>Pacta sunt servanda：条约生效后须<b>善意履行</b>（VCLT Art 26）</li></ul>`},
 {t:'案例：Trail Smelter（美国 v 加拿大）',tag:'案例',b:`<p><b>Facts</b>：加拿大 BC 省的铅锌冶炼厂污染哥伦比亚河，河水流入美国华盛顿州。</p>
<p><b>Issue</b>: Whether Canada can be enjoined from causing harm to a U.S. river?</p>
<p><b>Rule</b>：一国有义务保护他国不受其管辖范围内个人行为的损害；当后果严重且有清楚有力的证据时，任何国家无权以这种方式使用其领土造成他国损害。</p>
<p><b>Holding</b>：加拿大在国际法上对冶炼厂的行为负责，须停止污染。</p>
<div class="tip">关键词：<b>negative servitudes / transboundary pollution</b>。这是"国家责任"的入门案例。</div>`}
]},
{t:'② Week 1｜英国法：判例与立法',pts:[
 {t:'判例约束力与层级',tag:'考点',b:`<ul>
<li>上级法院判决约束下级；<b>Supreme Court</b> 可背离自己（1966 Practice Statement）</li>
<li>只有 <b>ratio decidendi</b>（判决理由）有约束力；<b>obiter dicta</b>（附带意见）只有说服力</li>
<li>Crown Court 受 High Court、Court of Appeal、Supreme Court 约束，<b>不受</b> County Court 约束</li>
<li>上级法院<b>overrule</b> 下级判例：那个案子的<b>结果仍然有效</b>，只是规则今后不再适用（判断题爱考）</li></ul>`},
 {t:'规避先例的五种方法',tag:'考点',b:`<ul>
<li>① <b>Distinguish</b> 事实不同</li>
<li>② 主张 <b>ratio 不清晰</b>（obscure）</li>
<li>③ 原判决<b>遗漏了关键法律点</b></li>
<li>④ 与某个<b>基本法律原则冲突</b>（或与后法冲突 → 成文法优先）</li>
<li>⑤ 主张先例<b>过宽</b>（too wide）</li></ul>
<div class="tip">Seminar 那道选择题：高等法院法官受上诉法院约束，但若 1975 年成文法已实质推翻该判例，可不受约束 → 选 "不符合 1975 年成文法"。</div>`},
 {t:'判例法的优缺点（论文题必备）',tag:'考点',b:`<table><tr><th>优点</th><th>缺点</th></tr>
<tr><td>确定性（certainty）、可预测</td><td>为避免不公而做不合逻辑的区分（illogical distinctions）</td></tr>
<tr><td>清晰（clarity），ratio 可提炼一般原则</td><td>判决之间可能前后不一致</td></tr>
<tr><td>灵活（flexibility），随情势变化</td><td>限制法官裁量</td></tr>
<tr><td>细致（detail），能贴合具体事实</td><td>可能形成不公的先例</td></tr>
<tr><td>实用（practicality），优于抽象立法</td><td>需大量检索，成本高</td></tr></table>`},
 {t:'成文法与授权立法',tag:'考点',b:`<ul>
<li>议会至上（Parliamentary sovereignty）：可制定或废除任何法律，法院必须执行</li>
<li><b>Delegated legislation</b>：议会授权部长/机构制定细则（如安全条例）</li>
<li>优点：民主回应性、可处理任何问题、条文精细、能快速应对新问题</li>
<li>缺点：篇幅庞大、审议时间不足、大量占用议会时间、只能做一般规定</li></ul>`},
 {t:'民法法系 vs 普通法法系',tag:'框架',b:`<table><tr><th></th><th>Civil Law</th><th>Common Law</th></tr>
<tr><td>代表国家</td><td>法、德、中、日、多数非洲与南美</td><td>英、美、加、澳、印、新西兰</td></tr>
<tr><td>法源</td><td><b>法典</b></td><td><b>判例</b>（stare decisis）</td></tr>
<tr><td>推理</td><td>演绎（deductive）</td><td>归纳（inductive）</td></tr>
<tr><td>法官角色</td><td>主动（inquisitorial），查证事实</td><td>被动（adversarial），主持对抗</td></tr>
<tr><td>律师角色</td><td>基于法院查明的证据辩论</td><td>自行发问、取证、构建案情</td></tr></table>`},
 {t:'为什么会计要学法律',tag:'考点',b:`<p>三个层次，从近到远：</p>
<ol><li><b>账本身被法律定义</b>：什么算收入、什么算负债、什么时候确认——背后都是合同法与公司法。合同没成立，就谈不上 revenue（对应 IFRS 15 的 performance obligation）。</li>
<li><b>判断与披露靠法律事实</b>：或有负债（IAS 37 contingent liability）、诉讼、担保、违约赔偿，全要先看法律上「义务是否已存在」，才能定要不要计提、要不要披露。</li>
<li><b>跨境交易的时间点与风险</b>：CISG 决定风险何时转移（Art 66–67），Incoterms 决定运费与保险谁承担——这两个直接决定收入确认时点和存货归属。</li></ol>
<div class="tip">论文题可以这么收尾：会计不是法学的旁观者，<b>会计确认的每一个时点，背后都站着一个法律判断</b>。</div>`}
]},
{t:'③ Week 2｜CISG 是什么、什么时候适用',pts:[
 {t:'CISG 一页概览',tag:'框架',b:`<ul>
<li>全称《联合国国际货物销售合同公约》，<b>1988 年 1 月 1 日</b>生效，约 94 个国家</li>
<li>中国：<b>是</b>缔约国（1988.1.1 起；香港自 <b>2022.12.1</b> 起适用）</li>
<li><b>英国：不是</b>缔约国（少数未加入的主要国家之一）</li>
<li>共 <b>101 条</b>，四部分：</li></ul>
<table><tr><th>Part</th><th>条文</th><th>内容</th></tr>
<tr><td>I</td><td>1–13</td><td>总则：适用范围、解释</td></tr>
<tr><td>II</td><td>14–24</td><td>合同<b>成立</b></td></tr>
<tr><td>III</td><td>25–88</td><td>买卖双方<b>权利义务</b>与救济</td></tr>
<tr><td>IV</td><td>89–101</td><td>批准与生效</td></tr></table>`},
 {t:'Art 1：适用范围（三条判断）',tag:'考点',b:`<ul>
<li>① 货物销售合同（sale of goods）</li>
<li>② 双方<b>营业地在不同国家</b>（place of business，不看国籍！）</li>
<li>③ 两国均为缔约国；或冲突规范指向缔约国法</li>
</ul>
<div class="warn">国籍、当事人的民商身份都不影响。中国人在新西兰卖给中国人 → 营业地中新两国，CISG 适用。</div>`},
 {t:'Art 10：多个营业地怎么办',tag:'考点',b:`<p><b>规则（Art 10）</b>：当事人有多个营业地时，取<b>与合同及其履行关系最密切（closest relationship）</b>的那一个，并考虑订约时或订约前已知或预期的情况。</p>
<p><b>为什么要判这个</b>：Art 1 用「place of business」决定 CISG 适不适用（双方营业地是否都在缔约国）；Art 10 是它的配套条款，专门解决「营业地在哪」。</p>
<p><b>判断步骤</b>：① 列出所有营业地 → ② 看合同在哪谈成、货从哪发、款付到哪 → ③ 选关系最紧密的那个 → ④ 再看该国是不是缔约国。</p>
<p><b>Asante 案</b>：被告主张营业地在加拿大，法院依 Art 10 认定为加拿大 → 美加均为缔约国 → CISG 适用。</p>
<div class="warn">两个易错：① 有分公司不等于多个营业地，要看它是否<b>独立签订合同</b>；② 没有营业地的（如个人）用 habitual residence（Art 10 末句）。</div>`},
 {t:'Art 6：能不能"退出"CISG（opt out）',tag:'考点',b:`<ul>
<li>当事人可以<b>排除</b>（exclude）CISG 或减损其效力</li>
<li>排除必须<b>明确</b>（clear intent）——只写"适用加州法"<b>不够</b>，因为美国法本身包含 CISG（条约优先）</li>
<li>Incoterms 属"贸易惯例"（usage），选 FOB/CIF 会改变 CISG 的默认规则（如风险转移）</li></ul>
<div class="tip">CISG 是"默认适用、可以退出"（opt-out）模式，不是"必须明示选择才适用"（opt-in）。</div>`},
 {t:'Art 4 / Art 7：管什么、怎么解释',tag:'考点',b:`<ul>
<li><b>Art 4</b>：只管<b>合同成立</b>与买卖双方的<b>权利义务</b>。不管：合同效力、所有权转移、产品责任人身伤亡</li>
<li><b>Art 7(1)</b>：解释要顾及<b>国际性质</b>、促进<b>统一适用</b>、遵守<b>善意</b>（good faith）</li>
<li><b>Art 7(2)</b>：未明文解决的事项 → 依公约的<b>一般原则</b>（如减损义务、信息披露）→ 仍无则依冲突规范指向的国内法</li></ul>`},
 {t:'Art 8 / Art 9：怎么解读当事人的话与做法',tag:'考点',b:`<ul>
<li><b>Art 8(1)</b>：主观标准——按表意人<b>真实意图</b>，只要对方知道或不可能不知道</li>
<li><b>Art 8(2)</b>：客观标准——若意图不明，按<b>同类的合理人</b>在当时情境下的理解</li>
<li><b>Art 8(3)</b>：还要看全部相关情况：<b>谈判过程、双方既有习惯做法（practices）、贸易惯例（usages）、后续行为</b></li>
<li><b>Art 9(1)</b>：双方<b>约定的惯例</b>和<b>彼此建立的惯常做法</b>有约束力</li>
<li><b>Art 9(2)</b>：双方知道或应当知道的、国际贸中<b>广泛知晓并普遍遵守</b>的行业惯例，视为默示适用</li></ul>
<div class="warn">Art 9(1)（双方自己的做法）优先于 Art 9(2)（行业惯例）—— Treibacher 案的全部胜负就在这一句。</div>`},
 {t:'案例：Treibacher v Allegheny（"consignment" 之争）',tag:'案例',b:`<p><b>Facts</b>：奥地利卖方 Treibacher 连续 7 年向美国买方 TDY 供应 TaC 粉末，交货方式写作"consignment"（寄售）。买方后拒绝提货付款，主张"consignment"按行业惯例＝用多少付多少。</p>
<p><b>Issue</b>: 该词应按<b>双方惯常做法</b>解释，还是按<b>行业惯例</b>解释？</p>
<p><b>Rule</b>: Art 9(1) + Art 8(3)。双方在长期往来中对一词形成的<b>共同理解</b>，优先于与之冲突的行业惯例。</p>
<p><b>Holding</b>：按双方做法解释——"consignment"意为<b>买卖已成立，只是发票延后到实际提货时开</b>。买方须付全部价款；卖方也已合理减损。</p>
<div class="tip">答题关键词：course of dealings controls customary usage。</div>`},
 {t:'CISG 排除的货物与交易（Art 2 / Art 3）',tag:'考点',b:`<table><tr><th>条文</th><th>排除什么</th><th>英文</th></tr>
<tr><td>Art 2(a)</td><td>个人/家庭/家用消费品</td><td>personal, family or household use</td></tr>
<tr><td>Art 2(b)</td><td>拍卖</td><td>auction</td></tr>
<tr><td>Art 2(c)</td><td>强制执行或依法出售</td><td>execution or otherwise by authority of law</td></tr>
<tr><td>Art 2(d)</td><td>股票、证券、票据、货币</td><td>stocks, shares, investment securities, negotiable instruments, money</td></tr>
<tr><td>Art 2(e)</td><td>船舶、气垫船、飞机</td><td>ships, hovercraft, aircraft</td></tr>
<tr><td>Art 2(f)</td><td>电力</td><td>electricity</td></tr>
<tr><td>Art 3(1)</td><td>以劳务为主、货物只是辅助的合同</td><td>preponderance of services</td></tr>
<tr><td>Art 3(2)</td><td>买方提供大部分材料的「来料加工」</td><td>substantial part supplied by buyer</td></tr></table>
<p><b>要不要背理由</b>：要。考卷常问「why excluded」，一句话答：这些要么不适合「货物买卖」的风险分配逻辑（如拍卖、强制执行），要么属于其他专门法规范畴（证券、船舶、飞机有登记制度）。</p>
<div class="warn">易错：① 消费者买货自用被排除，但<b>商人买来再卖</b>不排除；② 软件、定制设备不一定排除，要看货物与服务的<b>比例</b>（Art 3），不是看它「是不是有形的」。</div>`},
 {t:'案例：Asante v PMC-Sierra（要不要 opt out）',tag:'案例',b:`<p><b>Facts</b>：加州买方 Asante 与（法院认定营业地在）加拿大的卖方 PMC 发生电子元件质量争议。双方订单条款分别写"适用买方地址所在州法（加州）"。</p>
<p><b>Issues</b>：① 联邦法院有管辖权吗？② CISG 适用吗？③ 这种法律选择条款算不算排除 CISG？</p>
<p><b>Holding</b>：<br>
① 有——CISG 是美国批准的条约，涉条约的民事案件联邦法院有原始管辖权（28 U.S.C. §1331）<br>
② 适用——双方营业地在美、加两个缔约国（Art 1、Art 10）<br>
③ <b>不算排除</b>——没有"明确"排除的意思；选"加州法"实际上仍受条约优先（Supremacy Clause）约束<br>
④ 因此 CISG 优先于加州州法，案件留在联邦法院</p>
<div class="tip">这个案子是全课程最常被引用的"opt-out 标准"：<b>mere reference to a domestic law is not an opt-out</b>。</div>`}
]},
{t:'④ Week 3｜合同成立：Offer & Acceptance（Art 14–24）',pts:[
 {t:'Art 14：什么才算 offer',tag:'公式',b:`<p>三个要件（缺一不可）：</p>
<ol style="padding-left:18px">
<li><b>Intent to be bound</b>：表明一经承诺即受约束的意思</li>
<li><b>Sufficiently definite</b>：写明<b>货物</b>，并明示或默示地确定<b>数量与价格</b>（或规定确定方法）</li>
<li><b>Addressed to one or more specific persons</b>：向特定人发出</li></ol>
<p>Art 14(2)：<b>向公众</b>发出的（广告、目录）原则上只是 <b>invitation to make offers</b>，除非明确表示相反。</p>
<div class="warn">报纸广告不是 offer——因为不是"特定人"。这是课件原题。</div>`},
 {t:'价格没写＝不是 offer？',tag:'考点',b:`<p><b>Art 55</b>：合同已有效成立但未明示或默示确定价格时，视为当事人<b>默示参照</b>缔约时同类货物在相关贸易中<b>通常收取的价格</b>。</p>
<div class="tip">所以"价格空白"不影响 offer 的成立——offer 仍然有效，只是价格按 Art 55 补齐。答题顺序：先 Art 14 判 definiteness，再 Art 55 补价格。</div>`},
 {t:'Pro forma invoice 是不是 offer？（课件重点）',tag:'考点',b:`<ul>
<li>国际贸易中的 <b>pro forma invoice</b>（形式发票）通常被认定为 <b>offer</b>，不是账单</li>
<li>买方的 <b>purchase order</b> 则是 acceptance（或反要约，若改了条件）</li>
<li>若发票上写"firm offer / 有效期至某日" → 可能构成 <b>Art 16(2)(a)</b> 的不可撤销要约</li></ul>
<div class="warn">你发的两份 PDF 只有图片没有文字层，我读不到里面的具体条款。如果里面有"valid until"或"subject to our confirmation"这类字眼，性质会变——发我截图我再判。</div>`},
 {t:'Art 15：生效与"撤回"（withdrawal）',tag:'公式',b:`<ul>
<li>要约<b>送达</b>受要约人时才生效（receipt rule）</li>
<li>在生效<b>之前</b>撤回：即使要约写明"不可撤销"，也可以撤回（因为还没生效）</li>
<li>撤回通知须在要约<b>到达前或同时</b>到达</li></ul>
<div class="warn">区分两个词：<b>withdrawal</b>（要约生效前的撤回）vs <b>revocation</b>（生效后的撤销）。中文都翻"撤回/撤销"，英文别混。</div>`},
 {t:'Art 16：能不能撤销（revoke）',tag:'公式',b:`<ul>
<li>原则上可以，但必须在受要约人<b>发出承诺之前</b>撤销通知到达</li>
<li>例外（不可撤销）：<br>
 ① 要约表明<b>固定期限</b>或其它方式表明不可撤销（<b>firm offer</b>）<br>
 ② 受要约人<b>合理信赖</b>该要约为不可撤销并已据以行事</li></ul>
<div class="tip">Quiz 2 的答案就在这两条：撤销通知在要约到达<b>之前</b>就到达了（1/5 电话留言 vs 1/7 收到信）→ 要约根本没生效 → <b>没有合同</b>。</div>`},
 {t:'Art 18：承诺何时生效（receipt rule）',tag:'公式',b:`<ul>
<li>承诺＝声明或行为，表示同意；<b>沉默或不作为本身不构成承诺</b></li>
<li>承诺<b>到达</b>要约人时生效（英国法的 postal rule 在这里<b>不适用</b>！）</li>
<li>时限：要约指定的期限内；未指定则"合理期间"；口头要约须<b>立即</b>承诺</li>
<li><b>Art 18(3)</b>：若依要约、双方习惯或惯例，受要约人可<b>以行为</b>表示同意（如发货、付款）而无须通知，则承诺自<b>行为完成时</b>生效</li></ul>
<div class="warn">Art 18(3) 是 Week 3 作业题的核心：卖方"发货"这个动作本身就是承诺，所以买方发货后不能再撤销要约。</div>`},
 {t:'Art 17 / 19 / 22 / 23：承诺的变形与合同成立时点',tag:'考点',b:`<ul>
<li><b>Art 17</b>：拒绝在<b>到达</b>要约人时生效（要约随之消灭）</li>
<li><b>Art 19</b>：附有<b>实质性修改</b>的答复＝<b>反要约</b>。Art 19(3) 列举：价格、付款、质量、数量、交货地点时间、责任范围、争议解决 → 都算实质性</li>
<li><b>Art 22</b>：承诺可以撤回，但撤回须在承诺生效前或同时到达（若同时发出拒绝与承诺，<b>先到者生效</b>）</li>
<li><b>Art 23</b>：合同于<b>承诺生效时</b>成立</li></ul>
<div class="tip">课件例子：A 报 800/台 3 天发货；B 还价 600 → 反要约（Art 19(3) 价格）；C 接受 800 但改成次日发货 → 也是反要约（交货时间）。</div>`}
]},
{t:'⑤ Week 3｜履行、违约与救济（Art 25–88）',pts:[
 {t:'卖方的三大义务（Art 30）',tag:'考点',b:`<ol style="padding-left:18px">
<li><b>交付货物</b>（Art 31 地点、Art 33 时间）</li>
<li><b>移交单据</b>（Art 34）</li>
<li>保证货物<b>符合合同</b>（conformity，Art 35）</li></ol>
<p><b>Art 35</b>：数量、质量、规格符合；按合同方式包装；并须<b>适用于同一规格货物的通常用途</b>（除非买方在缔约时知道或不可能不知道该缺陷）。</p>
<div class="warn">买方义务只有两条（<b>Art 53</b>）：<b>付款</b> + <b>收取货物</b>。别把"开信用证"当成绝对义务——Natural Gas 案里就因卖方不配合而不构成违约。</div>`},
 {t:'Art 25：根本违约（fundamental breach）',tag:'公式',b:`<p>损害达到<b>实质性地剥夺</b>对方依合同本可期待的利益，<b>除非</b>违约方未预见且同类合理人在同样情况下也不会预见该结果。</p>
<div class="tip">两个层次：① 客观：是否实质剥夺期待利益；② 主观：是否可预见。考"是否构成 fundamental breach"时，两句都要写。</div>
<div class="warn">根本违约的后果不是自动解除——<b>还要依 Art 26 通知</b>。</div>`},
 {t:'Art 49 / 26 / 81：买方解除合同的三件套',tag:'公式',b:`<ul>
<li><b>Art 49</b>：买方可解除，若 ① 卖方<b>根本违约</b>；或 ② 买方给了 <b>Nachfrist notice</b>（额外合理期限）而卖方仍不履行</li>
<li><b>Art 26</b>：解除须<b>通知</b>对方，通知发出即生效（declaration of avoidance）</li>
<li><b>Art 81</b>：解除后双方<b>免除</b>履行义务，已交付的须<b>返还</b>；但损害赔偿请求权<b>保留</b></li></ul>
<div class="tip">Natural Gas 案：买方只是起诉索赔，<b>从未通知解除</b> → 法院认定合同未被解除 → 按 Art 74 算损失，而不是按解除后的返还算。</div>`},
 {t:'Art 74 / 77 / 80：赔偿的三道闸门',tag:'公式',b:`<ul>
<li><b>Art 74</b>：赔偿＝损失（<b>含利润损失</b>），但<b>不得超过</b>违约方在缔约时<b>已预见或应当预见</b>的损失</li>
<li><b>Art 77</b>：受损方须采取<b>合理措施减损</b>，否则可扣减；<b>举证责任在违约方</b></li>
<li><b>Art 80</b>：一方<b>自己</b>的行为或疏忽导致对方不履行，则不得主张对方违约</li></ul>
<div class="warn">利润损失（lost profit）要成立，前提是违约方<b>知道或应当知道</b>这个转售/预期用途——Natural Gas 里正是因卖方知道转售才判赔。</div>`},
 {t:'救济清单：买方 vs 卖方',tag:'考点',b:`<table><tr><th>买方（Art 46, 49, 50）</th><th>卖方（Art 62, 63, 64, 65）</th></tr>
<tr><td>要求实际履行（交付替代物 <b>Art 46(2)</b> / 修理 Art 46(3)）</td><td>要求买方付款、收取货物</td></tr>
<tr><td>解除合同（Art 49）</td><td>解除合同（Art 64，镜像）</td></tr>
<tr><td><b>减价</b>（Art 50，price reduction）</td><td>补足规格（missing specifications, Art 65）</td></tr>
<tr><td>拒收提前交付/超量交付</td><td>要求对方履行其他义务</td></tr></table>
<div class="warn">课件误写"Art 29 可要求替代货物"，正确是 <b>Art 46(2)</b>（Art 29 讲的是合同修改）。减价是 CISG 独有的买方救济，英美法没有——这是 CISG vs UCC 对比表的考点。</div>`}
]},
{t:'⑥ Week 3｜风险转移（Art 66–69）+ Incoterms',pts:[
 {t:'Art 66 / 67：风险什么时候过',tag:'公式',b:`<ul>
<li><b>Art 66</b>：风险转移<b>之后</b>的灭失或损坏，<b>不免除</b>买方付款义务——除非损失是因<b>卖方的行为或疏忽</b>造成</li>
<li><b>Art 67(1)</b>：涉及运输的，货物<b>交付给第一承运人</b>时风险转移给买方</li>
<li><b>Art 68</b>：运输途中销售的货物，风险自<b>订立合同</b>时转移</li>
<li><b>Art 69</b>：其他情况，买方<b>接收货物</b>时，或货物交其处置而其不接收时</li></ul>
<div class="warn">关键判断：货在<b>风险转移前</b>就已不符合同 → 卖方责任（Art 35/36）；转移<b>后</b>才坏 → 买方仍要付钱（Art 66）。</div>`},
 {t:'案例：Chicago Prime Packers v Northam（肉排案）',tag:'案例',b:`<p><b>Facts</b>：美国卖方 Chicago Prime 卖猪排给加拿大买方 Northam。货到后买方称"状况不良"拒付。</p>
<p><b>Issue</b>: ① 若猪排在买方代理人收货时就已变质，谁承担？② 若收货后才变质，谁承担？③ 谁来证明变质发生在何时？</p>
<p><b>Rule</b>: Art 35（相符义务）、Art 66、Art 67(1)（交给第一承运人时风险转移）。</p>
<p><b>Holding</b>：① 转移前变质 → 卖方负责，买方可拒付；② 转移后变质 → 买方仍须付款；③ <b>CISG 未明确规定举证责任</b>，但美国法院按 UCC 思路要求<b>买方</b>证明货物在风险转移时即不符合同。本案买方举证失败 → 必须付款。</p>
<div class="tip">这类题的答题结构：先定<b>风险转移时点</b>（Art 67(1)），再定<b>不符合同的时点</b>（谁举证），最后套 Art 66。</div>`},
 {t:'Incoterms 与 CISG 的关系',tag:'考点',b:`<ul>
<li>Incoterms 是<b>国际惯例</b>（usage），CISG 是<b>国际条约</b></li>
<li>合同引入某个贸易术语（如 FOB）时，该术语作为<b>特别约定优先于 CISG 的一般规定</b></li>
<li>对应关系：交货地点 CISG Art 31 / Incoterm A2；交货时间 Art 33 / A2；单据 Art 34 / A1、A6；风险 Art 66–70 / A3</li></ul>
<p><b>FOB（Incoterms 2020）</b>：买方指定船舶并支付运费；卖方在<b>装运港把货物装上船</b>时完成交付，<b>风险自货物装上船时</b>转移给买方。</p>
<div class="warn">作业最后一问：FOB 下风险在"装上船"而非"交给承运人"，此时 <b>Incoterms 优先</b>，不再适用 Art 67(1) 的"第一承运人"规则。</div>`},
 {t:'案例：The Natural Gas Case（奥地利最高法院 1996）',tag:'案例',b:`<p><b>Facts</b>：买方为自身及第三方购气，卖方从美国发货。买方需开信用证，但银行要知道装货地；卖方答应提供却始终没给。后卖方称其美国供应商不愿出口到比利时。第三方另购气多花 $141,131，买方另损失利润 $15,000，遂起诉。</p>
<p><b>五个争点与结论</b>：</p>
<table><tr><th>Issue</th><th>结论</th><th>依据</th></tr>
<tr><td>买方未开信用证是否违约</td><td>否</td><td><b>Art 80</b>：是卖方自己没提供装货地造成</td></tr>
<tr><td>卖方是否违约</td><td>是</td><td><b>Art 30</b>：未交付货物、未提供单据</td></tr>
<tr><td>合同是否被买方解除</td><td>否</td><td><b>Art 26</b>：买方从未通知解除</td></tr>
<tr><td>买方能否索赔利润损失</td><td>能</td><td><b>Art 74</b>：卖方知道转售，属可预见损失</td></tr>
<tr><td>买方是否未减损</td><td>否</td><td><b>Art 77</b>：举证责任在卖方，卖方未证明</td></tr></table>
<div class="tip">这题就是老师 Week 3 作业第 2 题，答题时按 issue 逐条写 rule + application，别混成一段。</div>`}
]},
{t:'⑦ 案例库（按考点速查）',pts:[
 {t:'一张表记住所有案例',tag:'案例',b:`<table><tr><th>案例</th><th>考点</th><th>一句话</th></tr>
<tr><td><b>Trail Smelter</b></td><td>国家责任、跨国污染</td><td>一国不得以造成他国严重损害的方式使用领土</td></tr>
<tr><td><b>Asante v PMC-Sierra</b></td><td>Art 6 opt out、Art 10、联邦管辖</td><td>选"某州法"不构成排除 CISG，CISG 优先于州法</td></tr>
<tr><td><b>Treibacher v Allegheny</b></td><td>Art 8(3)、9(1) vs 9(2)</td><td>双方惯常做法优先于行业惯例</td></tr>
<tr><td><b>Chicago Prime v Northam</b></td><td>Art 35、66、67(1)</td><td>风险转移后由买方举证不符合同</td></tr>
<tr><td><b>Natural Gas</b></td><td>Art 80、30、26、74、77</td><td>自己造成的对方不履行不能主张；解除须通知</td></tr>
<tr><td><b>Sinochem v Krupp</b></td><td>根本违约 Art 25、opt out</td><td>合同写"按纽约法" ≠ 排除 CISG</td></tr>
<tr><td><b>High Sea Treaty</b>（作业假设）</td><td>custom 的 usus</td><td>50 国长期一致实践即构成 usus，不必全体</td></tr></table>`},
 {t:'Sinochem v Krupp（中石油案）怎么答',tag:'案例',b:`<p><b>争议</b>：合同写"按当时纽约法订立、管辖和解释"，卖方主张已排除 CISG；买方主张应适用 CISG。</p>
<p><b>结论</b>：<b>买方对</b>。理由照搬 Asante：</p>
<ol style="padding-left:18px">
<li>两国均为缔约国（中新？——注意：中国、德国都是缔约国）</li>
<li>未<b>明确</b>排除 CISG，仅提"纽约法"不等于 opt out</li>
<li>美国法（纽约州法）本身受条约优先约束，CISG 间接适用 → 目的是<b>统一</b></li>
</ol>
<p>实体上：焦炭 HGI 指标 32 远低于合同标准，导致无法在国内市场销售、合同目的落空 → 可能构成 <b>Art 25 根本违约</b>。</p>`}
]},
{t:'⑧ 作业与 Quiz 答案（Week 1–3）',pts:[
 {t:'Week 1 判断题（全解析）',tag:'考点',b:`<table><tr><th>题目</th><th>答案</th><th>为什么</th></tr>
<tr><td>Comity 是各国必须遵守的正式实践</td><td><b>F</b></td><td>礼让不是法，只是善意礼节</td></tr>
<tr><td>存在联合国等正式造法机构</td><td><b>F</b></td><td>世界上没有正式的造法机关</td></tr>
<tr><td>条约不是 ICJ 适用的渊源</td><td><b>F</b></td><td>Art 38(1)(a) 第一项就是条约</td></tr>
<tr><td>习惯法是 ICJ 适用的渊源</td><td><b>T</b></td><td>Art 38(1)(b)</td></tr>
<tr><td>usus 须一致、悠久、所有国家遵守</td><td><b>F</b></td><td>不必悠久、不必全体，需相当数量主要国家</td></tr>
<tr><td>Convention 是两国间的约束性协议</td><td><b>F</b></td><td>那是 treaty；convention 由国际组织主持</td></tr>
<tr><td>口头协议可构成条约</td><td><b>F</b></td><td>VCLT Art 2(1)(a) 要求<b>书面</b></td></tr></table>
<p>其余：Jus cogens 偏<b>自然法</b>；两大法系＝Romano-Germanic Civil Law + Anglo-American Common Law；并非所有国家间协议都是条约（须双方同意受国际法支配）；认为国家只按自身利益守法的流派＝<b>Hobbesians</b>。</p>`},
 {t:'Week 2 作业答案',tag:'考点',b:`<ul>
<li><b>101 条、四部分</b>（Part I: 1–13 总则；II: 14–24 成立；III: 25–88 权利义务；IV: 89–101 生效）</li>
<li><b>Contracting States</b>：批准/加入公约的国家；可声明只在双方均为缔约国时适用（Art 95 保留）</li>
<li><b>Asante 的 case point</b>：争点其实是<b>联邦管辖权</b>；因 CISG 是条约且优先于州法，故适用 CISG、留在联邦法院；"选加州法"不构成 opt out</li>
<li><b>Good faith 的含义</b>：法院应参照外国判决，仅在明显可区分、明显错误或情势已变时才背离 → 促进统一适用</li>
<li><b>CISG vs UCC 差异</b>：承诺生效——UCC 采<b>发出主义（dispatch）</b>，CISG 采<b>到达主义（receipt）</b>；<b>减价</b>是 CISG 独有救济（UCC 无）</li>
<li><b>排除的六类</b>：消费品、拍卖、强制执行出售；证券/货币/票据、船舶/飞机/气垫船、电力</li></ul>`},
 {t:'Week 3 作业 1：发货后还能撤销要约吗',tag:'例题',b:`<p><b>Facts</b>：买方发 offer："按你方惯常价格发 100 件，5 月 31 日前交货"；卖方 5/30 前发货；发货<b>次日</b>买方打电话撤销。</p>
<b>买方论点</b>（三步法）：<br>
① 法律：Art 16(1)，承诺<b>发出</b>前可撤销要约。<br>
② 适用：我撤销时，你方尚未向我发出任何<b>承诺声明</b>。<br>
③ 结论：撤销有效，无合同。
<hr>
<b>卖方论点（更强）</b>：<br>
① 法律：<b>Art 18(3)</b>——依要约、双方习惯做法或惯例，受要约人可以<b>以行为</b>表示同意而无须通知，承诺自<b>行为完成时</b>生效。<br>
② 适用：双方长期按同一模式交易（惯例）；买方要约本身要求"发货"，即默示允许以发货承诺；卖方在 5/30 前完成发货＝承诺完成，合同已成立。<br>
③ 结论：<b>不能撤销</b>——Art 16(1) 只允许在承诺<b>发出前</b>撤销，而承诺已于发货时生效。
<div class="tip">另外可加一句：价格写"your customary price"不影响要约的确定性，Art 55 可补价格。</div>`},
 {t:'Quiz 1：目录寄给 50 万人算 offer 吗',tag:'例题',b:`<p><b>分析</b>：Art 14(1) 三要件。目录<b>逐个具名寄送</b>（符合"特定人"），列明货物与价格（符合确定性），但——</p>
<ul>
<li>是否存在 <b>intent to be bound</b>？向 500,000 人同时发出、可无限供货的目录，通常被认为只是 <b>invitation to make offers</b>（Art 14(2) 的精神：面向公众者仅为要约邀请）</li>
<li>若认定"具名寄送＝向特定人"，则可能构成 offer，John 承诺即成立合同</li>
</ul>
<p><b>结论</b>：更可能<b>不是 offer</b>；John 的"承诺"只是一项<b>要约</b>，零售商可拒绝，无合同。</p>
<div class="warn">这题的关键不是"具名"，而是"有没有受约束的意思"。答题时两种可能都写，再给出倾向性结论，比只下结论分高。</div>`},
 {t:'Quiz 2：撤回通知先到，合同成立吗',tag:'例题',b:`<p><b>结论：没有合同。</b></p>
<ol style="padding-left:18px">
<li><b>Art 15(1)</b>：要约<b>到达</b>受要约人时才生效。1/7 信才到 → 1/7 前要约尚未生效</li>
<li><b>Art 15(2)</b>：即使要约声明"不可撤销"，只要撤回通知在要约<b>到达前或同时</b>到达，仍可撤回。1/5 的语音留言已到达（留在营业地答录机）</li>
<li>要约从未生效，1/7 的"承诺"无对象 → <b>Art 23</b> 无合同成立</li>
</ol>
<div class="warn">陷阱：看到"binding and irrevocable until Feb 1"就答"不可撤销"。Art 16(2) 的不可撤销<b>以要约已生效为前提</b>。</div>`},
 {t:'Quiz 3：软件下载后不兼容，谁负责',tag:'例题',b:`<p><b>分析框架</b>：</p>
<ol style="padding-left:18px">
<li>CISG 是否适用？——"货物"是否包括<b>在线下载的软件</b>有争议；若视为货物且双方营业地在缔约国，则适用</li>
<li><b>Art 35</b>：卖方须交付符合约定数量、质量、规格的货物，并<b>适用于通常用途</b>；但若买方缔约时知道或应当知道该限制，则卖方不负责</li>
<li><b>Art 35(2)(b)</b>：特定用途的适合性，以买方<b>明示或默示告知</b>卖方为前提——本案买方从未告知自己的配置</li>
<li><b>举证</b>：依 Chicago Prime 思路，<b>买方</b>须证明货物在风险转移时即不符合同</li>
</ol>
<p><b>结论</b>：倾向于<b>卖方正确</b>——未约定配置要求时，检查自身电脑兼容性是买方的责任；买方难以证明交付时即存在不符合同。</p>`},
 {t:'Week 1 案例：High Sea Treaty（usus 之争）',tag:'例题',b:`<p><b>Issue</b>: Whether there is usus?</p>
<p><b>Step 1</b>: 习惯法需 usus（一致且反复的行为，由相当数量主要国家长期实践）+ opinio juris（视为有法律义务）。</p>
<p><b>Step 2</b>: 该多边条约已生效数年，约 50 国（含多数主要发达国家）长期不主张公海领土 → 数量与时间均足够；虽无国家"阻止"过 annexation，但 usus 可由<b>不作为</b>（non-involvement）构成。</p>
<p><b>Step 3</b>: 存在 usus，X 国的主张不能成立，其占领行为应被宣告无效。</p>`}
]}
,
{t:'⑨ Week 4｜全球做生意的五种方式：出口、代理、代表处、分公司、子公司',pts:[
 {t:'一张地图：五种进入方式，谁担责任',tag:'框架',b:`<table><tr><th>形式</th><th>是否独立法人</th><th>谁对债务负责</th><th>一句话</th></tr>
<tr><td><b>Export / Import</b></td><td>无新实体</td><td>自己（合同相对方）</td><td>最轻的跨境方式，只管四件事：transportation、financing、contracting、export licences</td></tr>
<tr><td><b>Agent</b></td><td>否</td><td>Principal（本人）</td><td>独立代表，做市场分析和产品推广，权限只到委托范围</td></tr>
<tr><td><b>Representative office</b></td><td>否</td><td>母公司</td><td>只是联络点，提供信息，<b>不做业务</b></td></tr>
<tr><td><b>Branch</b></td><td>否（是母公司的一部分）</td><td><b>母公司全部承担</b></td><td>有设施、有人员、能经营，但不是独立实体</td></tr>
<tr><td><b>Subsidiary</b></td><td><b>是</b>（separately incorporated）</td><td>母公司只以出资为限</td><td>本地注册的公司，隔离风险 + 拿本地税收优惠</td></tr></table>
<div class="tip">判断这类题的捷径：先问「它是不是独立法人」。不是 → 母公司兜底；是 → 母公司只赔出资。</div>`},
 {t:'Branch vs Subsidiary：本课最重要的一张对照表',tag:'考点',b:`<table><tr><th></th><th>Branch 分公司</th><th>Subsidiary 子公司</th></tr>
<tr><td>法律地位</td><td>母公司的一个 unit，只是 <b>extension</b>，同一个法人</td><td>separate legal entity，由母公司持有</td></tr>
<tr><td>存在形式</td><td>派人在当地、并建立设施（装配厂、矿场、服务办公室）</td><td>在 host state 按当地法<b>注册</b>一家公司</td></tr>
<tr><td>债务责任</td><td><b>母公司</b>对 branch 全部债务负责</td><td>母公司责任限于<b>投资额</b>（insulate from unlimited liability）</td></tr>
<tr><td>管理权</td><td>经理和员工的权限<b>只限于母公司授予的部分</b></td><td>有自己的董事会，本地治理</td></tr>
<tr><td>税务</td><td>常被按较高税率征税（外国 branch 待遇）</td><td>本地公司常享税收优惠（branch 拿不到）</td></tr>
<tr><td>典型用途</td><td>试水、工程/矿业项目、想直接控制</td><td>长期经营、隔离风险、本地融资</td></tr></table>
<p><b>课件图示题</b>：China Super Company 在美国 NYC / Los Angeles / Chicago 设三家子公司，其中一家欠债 → 母公司 <b>not liable</b>。</p>
<div class="warn">别把 branch 的"有固定资产、有员工、独立做账"当成独立人格。独立人格只看一件事：<b>是否 separate incorporation</b>。</div>`},
 {t:'Branch 两个必考问（课件 slide 7）',tag:'公式',b:`<p><b>Q1：谁对 branch 的债务负责？母公司还是 branch 自己？</b><br>
答：<b>母公司（parent company）</b>。branch 通常被视为公司的一个延伸（extension），公司对 branch 的任何债务负责。</p>
<p><b>Q2：谁任命 branch 的经理？</b><br>
答：母公司。branch 人员（含 manager 与员工）的权限<b>限于母公司已授予（delegated）的范围</b>。</p>
<div class="tip">两步法写答案：① 说明 branch 不是独立法人 → ② 由此推出责任和授权都回到 parent。</div>`},
 {t:'Agent 与 Representative office 的区别',tag:'考点',b:`<ul>
<li><b>Agent</b>：一个<b>独立</b>的个人（或公司），受雇做 market analysis / product promotion；受 principal 监督；权限限于委托</li>
<li><b>Representative office</b>：一个 <b>contact point</b>，让有兴趣的一方来获取公司信息，<b>不为公司做业务</b>（does not conduct business）</li>
<li><b>共同结论（课件原句）</b>：a business with an agent or representative office in a foreign nation is <b>generally not considered to be doing business</b> in the foreign country</li></ul>
<div class="warn">"不构成 doing business"是<b>法律结论</b>，不是事实描述——它有员工、有地址，只是法律上不算在当地经营。这种题问的是结论。</div>`},
 {t:'为什么不用子公司（优缺点对照）',tag:'考点',b:`<table><tr><th>用 branch / agent / rep office 的优点</th><th>缺点</th></tr>
<tr><td>母公司能<b>直接控制</b>（maintain direct control）海外经营，不用隔一层董事会</td><td>① 母公司要承担海外投资的<b>全部风险</b></td></tr>
<tr><td>设立快、成本低、可撤回</td><td>② 外国公司（或其代理/分支）常被按<b>更高税率</b>征税，比本地公司吃亏</td></tr>
<tr><td>利润直接并入母公司</td><td>③ 许多发展中国家要求<b>本地参股</b>（local participation）才允许投资或扩张</td></tr></table>
<p><b>反过来：设子公司的优点（slide 17）</b>——① 子公司的 company status 把母公司隔离在无限责任之外；② 本地组织的公司常能享受外国 branch 拿不到的税收优惠。</p>
<div class="tip">Ford 当年把 branch 全转成本地子公司，理由就是这两条：<b>tax considerations</b> + <b>insulate the parent from local liability</b>。</div>`},
 {t:'课件题：Lovells UK 在中国受中国法规管吗',tag:'例题',b:`<p><b>答：不受中国公司法的监管，只就"在中国境内赚到的钱"在中国纳税。</b></p>
<p>理由链：<br>
① 它是英国律所在中国设的 office，不是中国法人 → 在中国法上没有公司身份<br>
② 公司治理层面归 <b>home state</b>（英国）管母公司<br>
③ 征税权按 <b>source（来源地）</b>，所以只对来源于中国的所得征税</p>
<div class="warn">易错答法："受中国法全面监管"——把属地征税和属地监管公司治理混成一件事了。</div>`}
]},
{t:'⑩ Week 4｜MNE：母公司与从属结构（管辖是重点）',pts:[
 {t:'MNE 的两种结构（Type A / Type B）',tag:'框架',b:`<table><tr><th>类型</th><th>结构</th><th>例子</th></tr>
<tr><td><b>Type A</b></td><td>home state 的母公司，在一个或多个 host state 设子公司</td><td>US ABC 母公司 + China / Brazil / UK 三家子公司 → <b>home = US</b>，host = 中、巴、英</td></tr>
<tr><td><b>Type B</b></td><td>一国 corporation 的<b>全资子公司</b>，与 host state 的企业实体<b>合伙</b></td><td>美国母公司 → 中国全资子公司 → 与中方企业成立 partnership；<b>home = US，host = China</b></td></tr></table>
<div class="tip">判 home / host 只看一件事：<b>母公司注册在哪个国家</b>，那里就是 home state。子公司/合伙所在国都是 host。</div>`},
 {t:'管辖总原则 + 两个例外（这一页必考）',tag:'公式',b:`<p><b>一般原则</b>：home states 管 <b>parent firms</b>（母公司）；host states 管 <b>subordinate firms</b>（下属公司）。</p>
<p><b>例外①</b>：home state 可用 <b>extraterritorial laws</b>（域外法）管到国外的子公司。</p>
<p><b>例外②</b>：host state 可 <b>pierce the (fictional) veil</b>，把下属公司与母公司之间那层"虚构的面纱"揭掉，从而管到母公司。</p>
<div class="tip">为什么叫 fictional？因为 legal personality 本身就是<b>法律虚构</b>（artificial legal person）——公司、有限合伙都是。虚构的东西可以被 set aside，这就是刺破面纱的理论根子，也是 ⑫ 的引子。</div>`},
 {t:'Parent company 的四个判断标准',tag:'考点',b:`<ol style="padding-left:18px">
<li>持有子公司的<b>多数表决权</b>（majority of voting rights）</li>
<li>是子公司的 <b>member</b>，并有权任免其<b>多数董事</b></li>
<li>对子公司有 <b>dominant influence</b>（支配性影响）</li>
<li>控制 <b>超过 51%</b> 的表决权</li></ol>
<p><b>配套问：subsidiary 有独立人格吗？</b>有。所以母公司不为子公司债务买单（回到 slide 9 的 not liable）。</p>
<div class="warn">51% 是"控制"的量化线，不是"必须刚好 51%"。题干写"必须持有全部股份才是母公司" → 错。</div>`},
 {t:'National MNE vs International MNE',tag:'公式',b:`<table><tr><th></th><th>National MNE</th><th>International MNE</th></tr>
<tr><td>定义</td><td>围绕<b>一国</b>的母公司组织，通过其他国家的 branches 与 subsidiaries 经营</td><td>由<b>两个或以上不同国家</b>的母公司组成，共同拥有（co-own）在两个或以上国家的 subordinate operating businesses</td></tr>
<tr><td>例子</td><td>Shell plc（2022 年后）</td><td>Unilever（荷兰 + 英国两个母公司）</td></tr>
<tr><td>治理特征</td><td>单一母公司控股</td><td>两家控股公司共享部分董事，这些董事担任整个集团的 managing directors</td></tr></table>
<div class="tip">Shell 2022 的关键事实：简化股权结构、总部从荷兰迁到英国、去掉 Royal Dutch 名称 → 从 international 变 <b>national</b>。这种"结构变动 → 类型变动"的因果链是论述题最爱考的。</div>`},
 {t:'反例：Mitsubishi 没有母公司',tag:'案例',b:`<p><b>Q1：三菱集团有母公司吗？</b>答：<b>没有。</b></p>
<p><b>Q2：三菱和 Ford 的区别？</b>答：Ford 是母公司对子公司行使控制（parent exercises control over subsidiaries）；三菱由三家最重要的 sister companies 组成 <b>triumvirate（三头共治）</b>指导，不存在一个 parent。</p>
<div class="warn">"没有 parent 的集团"在会计上是判断"是否存在控制、要不要编合并报表"的经典难点（对应 FAR 的 consolidation）：没有单一控制方，合并边界就只能靠实质控制来定。</div>`},
 {t:'Joint venture 与 Starbucks East China：JV 怎么变成全资子公司',tag:'案例',b:`<p><b>Joint venture</b>：一群人/公司为某个商业项目合作，时间<b>超过临时性</b>（more than transitory）。</p>
<p><b>Starbucks 案（2017-07-27）</b>：星巴克以约 <b>13 亿美元</b>现金，从长期合资伙伴 Uni-President（统一）与 President Chain Store（统一超商）手中买下 East China JV 剩余 <b>50%</b> 股份 → 100% 拥有上海、江苏、浙江约 <b>1,300</b> 家门店，并计划到 2021 年从 2,800 家扩到 5,000 家以上。</p>
<p><b>课件问：East China 现在是 JV 还是全资子公司？</b><br>
答：<b>是 Starbucks US 100% 持有的子公司（wholly owned subsidiary），不再是 JV。</b></p>
<div class="tip">一句话公式：a JV becomes a subsidiary when one parent acquires 100% of the shares. 反过来，卖到 50% 以下就变回 joint venture。</div>`},
 {t:'Glossary：这些定义要用英文原话背',tag:'考点',b:`<table><tr><th>术语</th><th>一句话</th></tr>
<tr><td><b>Holding company</b></td><td>由母公司持有，用来<b>监督和协调</b>各子公司运作的公司</td></tr>
<tr><td><b>Parent company</b></td><td>持有子公司<b>多数（51%）表决权</b>的公司</td></tr>
<tr><td><b>Subsidiary</b></td><td>由母公司或其控股公司拥有；与 branch 不同，它 <b>separately incorporated</b></td></tr>
<tr><td><b>Representative office</b></td><td>联络点，提供信息，<b>不做业务</b></td></tr>
<tr><td><b>Joint venture</b></td><td>非临时性的合作经营</td></tr>
<tr><td><b>Common enterprise liability</b></td><td>共同事业中，<b>每个成员对整个事业的行为负责</b></td></tr>
<tr><td><b>Pierce the company veil</b></td><td>把"公司是独立主体"这个法律虚构放到一边，让股东像合伙人一样对公司行为负责</td></tr>
<tr><td><b>Wind up</b></td><td>清算、结束公司</td></tr></table>
<div class="warn">Holding company ≠ Parent company：holding 重在"持有+协调"，parent 重在"控股 51%"。实务中常重合，但定义不能互换着写。</div>`}
]},
{t:'⑪ Week 4｜英国四种商业组织形式（选择/简答高频）',pts:[
 {t:'四种形式 × 有无独立人格（一张表搞定）',tag:'公式',b:`<table><tr><th>形式</th><th>法律依据</th><th>独立法人人格</th><th>责任</th></tr>
<tr><td><b>Sole trader</b> 个体经营</td><td>无专门法（最多一张 licence）</td><td><b>无</b></td><td>个人无限责任</td></tr>
<tr><td><b>Company</b>（Ltd / PLC）</td><td>Companies Act 2006 + case law</td><td><b>有</b></td><td>以认购未缴出资为限</td></tr>
<tr><td><b>General partnership</b></td><td>Partnership Act 1890</td><td><b>无</b></td><td>合伙人个人对债务负责</td></tr>
<tr><td><b>Limited partnership</b></td><td>Limited Partnership Act 1907</td><td><b>无</b></td><td>GP 无限 + LP 以出资为限</td></tr>
<tr><td><b>LLP</b></td><td>Limited Liability Partnership Act 2000</td><td><b>有</b></td><td>members 以出资为限</td></tr></table>
<p><b>Quiz（slide 48）答案</b>：有独立人格 = <b>B Subsidiary、C Limited Liability Company、G LLP</b>；无 = A Branch、D Agent、E General Partnership、F Limited Partnership。</p>
<div class="warn">两个最容易错的：① <b>Branch 无独立人格</b>（它只是母公司的一部分）；② Subsidiary 之所以算，是因为它本身是"一家独立注册的公司"，不是因为"它是子公司"。</div>`},
 {t:'Sole trader：优点 5 条、缺点 6 条',tag:'考点',b:`<p>常见于零售、小规模服务业、手工艺类小制造。</p>
<table><tr><th>Advantages</th><th>Disadvantages</th></tr>
<tr><td>① 无正式程序（最多办个 licence）</td><td>① <b>个人无限责任</b></td></tr>
<tr><td>② 独立自主、自负其责（independence and self-accountability）</td><td>② 事业难以扩张（expansion）</td></tr>
<tr><td>③ 亲自监督（personal supervision）</td><td>③ 高度依赖个人（high dependence on the individual）</td></tr>
<tr><td>④ 全部利润归自己</td><td>④ 业主死亡，事业随之终结</td></tr>
<tr><td>⑤ 账目不公开（accounts kept private）</td><td>⑤ 只有一门手艺（水管工、刀具打磨工）</td></tr>
<tr><td></td><td>⑥ 其他：融资难、无规模经济</td></tr></table>
<div class="tip">简答写缺点时，<b>personal liability</b> 和 <b>dependence on the individual</b> 是得分点，别只写"钱不够"。</div>`},
 {t:'Ltd 与 PLC 的区别',tag:'考点',b:`<ul>
<li><b>Ltd.</b> = limited 的标准缩写；最流行的形式，成员对公司债务的责任显著有限（limited to the amount unpaid on their shares）</li>
<li><b>Private limited company（Ltd）</b>：股份不向公众发售，转让受章程限制</li>
<li><b>Public limited company（PLC）</b>：可向公众发售股份；须先取得 <b>trading certificate</b> 才能开始交易（无证交易 → 见 ⑫ 的法定刺破情形）</li></ul>
<p><b>算一遍（slide 36）</b>：ABC Ltd 注册资本 1,000 股 × £1，Amy 200 股、Billy 300 股、Tom 500 股。公司欠 <b>100 万</b> → 三人最多只须把<b>未缴的股本</b>补上；个人房产、存款不受影响。这就是 Salomon 规则的实际效果。</p>
<div class="warn">有限责任保护的是<b>股东对公司</b>，不是"公司不用还钱"。公司仍要用全部资产清偿，不够的部分由债权人自担。</div>`},
 {t:'Partnership 三兄弟：GP / LP / LLP',tag:'公式',b:`<p><b>① General Partnership（PA 1890，最常见的合伙形式）</b></p>
<ul>
<li><b>无独立人格</b>：合伙人对事业的一切债务与责任<b>个人负责</b></li>
<li>每个合伙人 self-employed，按份额分利润</li>
<li>基础是 <b>partnership agreement</b> 与相互信任（trust）：一个合伙人消失，其余人要对<b>全部</b>债务负责</li></ul>
<p><b>② Limited Partnership（LPA 1907，多用于私募股权 private equity）</b></p>
<ul>
<li>至少一名 <b>GP</b> 承担全部责任；<b>LP</b> 以出资额为限，超出出资不再负责</li>
<li>LP <b>不参与</b>管理与经营</li></ul>
<p><b>③ LLP（LLP Act 2000）</b></p>
<ul>
<li><b>有独立人格</b>；members 的责任有限</li>
<li>参与者称 <b>members</b>（类似公司股东）</li>
<li>members 是 LLP 的 <b>agent</b>；LLP 对成员在业务过程中（或经授权）作出的<b>侵权/过失行为</b>对第三人承担 <b>vicarious liability</b></li>
<li>破产时 members 只损失<b>已投入的钱</b></li>
<li>须向 Company Registrar <b>提交年度审计账目</b></li>
<li><b>税务优势</b>：members 只就自己那部分利润被征税（穿透税制，不交公司税）</li></ul>
<div class="warn">LP 与 LLP 只差一个 L，结构完全相反：LP <b>无</b>独立人格、靠 GP 兜底；LLP <b>有</b>独立人格、全员有限。这两个写混等于整题作废。</div>`}
]},
{t:'⑫ Week 4｜独立法人人格：Salomon 与刺破面纱',pts:[
 {t:'什么是 separate legal identity（定义 + 三个后果）',tag:'公式',b:`<p><b>定义</b>：artificial persons（<b>companies 与 limited partnerships</b>）能<b>独立于其成员/股东</b>承担法律义务，即公司是与 members、directors 相区别的法律主体。</p>
<p><b>有什么后果（slide 29，直接背三条）</b>：</p>
<ol style="padding-left:18px">
<li>所有者责任<b>限于其对公司的投资</b>（limited liability）</li>
<li>归属于公司的权利与利益<b>属于公司</b>，不属于所有者</li>
<li>多数公司形态下，股东<b>既不是 manager、也不是 agent、也不是代表</b>：不能自己替公司决策、不能把公司绑进合同、不能以自己的行为让公司承担犯罪或侵权责任</li></ol>
<div class="tip">第 3 条最常被忽略，但它正是"公司机关（board）"存在的法律理由：只有被授权的人才能让公司负债。</div>`},
 {t:'Salomon v Salomon & Co Ltd [1897] AC 33（地基案例）',tag:'案例',b:`<p><b>Facts</b>：Salomon 设立了一家有限公司。公司资金不足、无法清偿债务，进入清算。他持有 20,007 股中的 <b>20,001 股</b>。清算人主张：他应像个体经营者一样<b>个人</b>清偿公司的全部债务。</p>
<p><b>Held</b>：公司<b>设立合法、无任何欺诈</b>；即使 Salomon 几乎持有全部股份，他也<b>没有义务</b>清偿公司债务。</p>
<p><b>Rule</b>：公司一经合法设立，即成为与其成员相区别的独立主体 → 股东有限责任成立。</p>
<div class="tip">答题只需两个关键词：<b>properly formed</b> + <b>no fraud</b>，再加一句结论：the company is a person distinct from its members。</div>`},
 {t:'有限责任到底保护谁（三条效果）',tag:'考点',b:`<ul>
<li>成员只须在<b>清算（winding up）</b>时补缴"可识别的、已认购未缴"的数额</li>
<li>保护成员免遭<b>债权人</b>追索——注意：这是给<b>成员</b>的好处，不是给公司本身的好处</li>
<li>保护成员免于<b>经营失败</b>的连带后果（company is unable to pay its own debts）</li></ul>
<div class="warn">"limited liability 是公司的特权"是错的。公司本来就要用全部资产还债；<b>被限制的是股东的责任</b>。</div>`},
 {t:'中国公司法 2018 vs 2023：注册资本那条改了什么',tag:'考点',b:`<table><tr><th>2018 版 Art 26</th><th>2023 修订 Art 47</th></tr>
<tr><td>有限责任公司的注册资本 = 全体股东<b>认缴</b>的出资额（在公司登记机关登记）</td><td>注册资本 = 全体股东<b>认缴</b>的出资额；<b>且</b>全体股东认缴的出资须自<b>公司成立之日起五年内</b>按章程规定<b>缴足</b></td></tr></table>
<p><b>考点怎么答</b>：从"认缴制不设缴付期限"改为"<b>五年实缴</b>"，目的是压缩空壳公司、保护债权人（呼应本课刺破面纱的立法逻辑）；对会计的影响是 subscribed capital 变成短期内的<b>实缴义务</b>，直接影响现金流预期与资本披露。</p>
<div class="warn">不要写"中国取消了认缴制"——认缴保留，加的是<b>期限</b>。</div>`},
 {t:'UK 什么情况下可以刺破面纱（法定情形清单）',tag:'考点',b:`<p><b>Ignoring separate identity = lifting / piercing the veil of incorporation</b>：把股东藏在面纱后面这层掩护拿掉。</p>
<ol style="padding-left:18px">
<li><b>PLC 无 trading certificate 而交易</b>（责任落到公司与相关高管）</li>
<li><b>董事</b>对损失或损害及罚款<b>个人负责</b></li>
<li><b>Fraudulent trading / wrongful trading</b>（Week 7 细讲）</li>
<li><b>Disqualified directors</b>（被取消资格的董事仍参与管理）</li>
<li><b>滥用公司名称</b>（abuse of company name）</li>
<li>其他：判例路径的 <b>sham / facade</b>（见下一张卡）</li></ol>
<div class="tip">这一页当成"公司法给债权人的安全阀"来背。答题先写总纲：the veil is lifted by statute or by case law where the company is used as a device to defeat the law or to commit fraud。</div>`},
 {t:'Gilford Motor Co Ltd v Horne [1933] Ch 935（规避竞业禁止）',tag:'案例',b:`<p><b>Facts</b>：Horne 是 Gilford 的 managing director，其雇佣合同禁止他离职后与雇主竞争。为规避该义务，他另设一家公司，通过这家公司提供与原雇主相同的服务。</p>
<p><b>Held</b>：上诉法院对 <b>Horne 和那家公司一并</b>发出禁令。公司是 <b>sham</b>；不能用公司结构规避合同义务、借公司之壳（a cloak or sham）经营。</p>
<p><b>Rule</b>：the veil is lifted to prevent <b>evasion of existing legal obligations</b>。</p>
<div class="tip">关键词组：<b>cloak or sham</b>、evade contractual duties、injunction against both。这案与 Salomon 不矛盾——Salomon 是"合法使用公司"，Horne 是"把公司当工具逃义务"。</div>`},
 {t:'Lazarus Estates Ltd v Beasley [1956] 1 QB 702（Denning：欺诈解开一切）',tag:'案例',b:`<blockquote style="border-left:3px solid #888;padding-left:10px;color:#555">
"<b>Fraud unravels everything.</b> No court in this land will allow a person to keep an advantage which he had obtained by fraud … Fraud is carefully not found unless it is distinctly pleaded and proved; but once it is proved, it vitiates judgments, contracts and all transactions whatsoever."（Denning LJ, at 712）</blockquote>
<p><b>三点用法</b>：<br>
① 靠欺诈取得的优势，法院一概不许保留；<br>
② 欺诈一经证明，判决、合同与一切交易<b>全部可被推翻</b>（vitiates）；<br>
③ <b>但</b>——必须明确主张并证明（distinctly pleaded and proved），法院不会主动推测欺诈。</p>
<div class="warn">这最后半句就是刺破面纱的<b>举证门槛</b>：主张者负责举证，且门槛很高。答案里忘了写"举证在主张方"，分数会掉。</div>`},
 {t:'刺破面纱的三步法模板',tag:'公式',b:`<p><b>Issue</b>: Whether the corporate veil should be lifted so that X is personally liable?</p>
<p><b>Step 1 — the law</b>: As a general rule (Salomon), a company is a legal person distinct from its members, so shareholders are not liable for its debts. Exceptionally the veil may be lifted: (a) by statute (trading without a trading certificate, fraudulent or wrongful trading, disqualified directors, abuse of company name); or (b) by case law where the company is a mere sham or cloak used to evade existing legal obligations (Gilford Motor v Horne), because fraud unravels everything (Lazarus Estates v Beasley).</p>
<p><b>Step 2 — apply</b>: 本案中，X 设立公司的目的是……；公司有无独立资产、有无独立经营，是否仅用于承接 X 个人的义务 → 是否构成 sham？欺诈是否有明确主张与证据？</p>
<p><b>Step 3 — conclusion</b>: 构成 → 面纱被刺破，X 与公司共同承担责任；不构成 → 仅公司承担责任，X 不负责。</p>
<div class="tip">三个必须写到的限制：① 刺破是<b>例外</b>；② <b>举证责任在主张者</b>；③ 仅"公司只有一个人""资本太小""业务失败"都<b>不足以</b>刺破。</div>`}
]},
{t:'⑬ Week 4｜一页速记 + 课件全部问答题',pts:[
 {t:'八个定义，英文原话背一遍',tag:'框架',b:`<table><tr><th>术语</th><th>一句话记法</th></tr>
<tr><td>Branch</td><td>extension of the parent; parent liable for its debts</td></tr>
<tr><td>Subsidiary</td><td>separate legal entity; liability limited to investment</td></tr>
<tr><td>Agent</td><td>independent representative; authority limited to what is delegated</td></tr>
<tr><td>Representative office</td><td>contact point; does not conduct business</td></tr>
<tr><td>National MNE</td><td>one parent state，通过 branch / subsidiary 在别国经营</td></tr>
<tr><td>International MNE</td><td>two or more parents from different states co-own subordinates</td></tr>
<tr><td>Separate legal personality</td><td>company distinct from its members（Salomon）</td></tr>
<tr><td>Lifting the veil</td><td>set aside the fiction → shareholders liable as if partners</td></tr></table>`},
 {t:'课件 6 个问答题（考卷原型）',tag:'例题',b:`<table><tr><th>问</th><th>答（要点）</th></tr>
<tr><td>Lovells UK 在中国受中国法规管吗</td><td>否；只就来源于中国的所得纳税（属地征税 ≠ 属地监管）</td></tr>
<tr><td>用 branch / agency / rep office 而非子公司的优点</td><td>母公司保持<b>直接控制</b>海外经营</td></tr>
<tr><td>其缺点</td><td>① 母公司承担全部风险 ② 常被按更高税率征税 ③ 发展中国家要求本地参股</td></tr>
<tr><td>设子公司的优点</td><td>① 隔离无限责任 ② 本地公司的税收优惠</td></tr>
<tr><td>HSBC 是 national MNE 吗</td><td>是：以英国为母国，通过各国分支/子公司经营（单一母公司体系）</td></tr>
<tr><td>Ford 与 Mitsubishi 的区别</td><td>Ford 有母公司控股子公司；Mitsubishi 无母公司，三家 sister companies 三头共治（triumvirate）</td></tr></table>`},
 {t:'这一章的三个"必踩坑"',tag:'易错',b:`<ol style="padding-left:18px">
<li><b>把"有资产、有员工、独立做账"当成独立人格</b>——只看 separate incorporation（branch 有这些但仍是母公司的一部分）。</li>
<li><b>把 LP 和 LLP 混了</b>——LP 无独立人格（GP 兜底），LLP 有独立人格（全员有限）。</li>
<li><b>看到"公司只有一个人/资本很小"就写刺破面纱</b>——不足；须落到法定情形或 sham + 欺诈，且举证在主张方。</li></ol>
<div class="tip">考前自测三问：① Branch 欠钱谁还？② MNE 的 home state 管谁、host state 管谁、两个例外是什么？③ 哪几种形式有独立人格？答不上就回去翻 ⑨⑩⑪。</div>`}
]}
]}
,
{id:'far',name:'Financial Accounting and Reporting',desc:'CH50035 · Week 1–4 已对齐（含 IAS 16 重估）· 论文 30% / 展示 20% / 期末 50%',chapters:[
{t:'⓪ 先补 ITA：这门课的地基',pts:[
 {t:'五要素与恒等式（整门课的地基）',tag:'框架',b:`<p>财务报表把企业的经济现实切成五个要素，每个都有英文定义（2018 框架）：</p>
<table><tr><th>要素</th><th>英文</th><th>一句话定义</th></tr>
<tr><td>资产</td><td>asset</td><td>由过去事件产生、企业<b>控制</b>的<b>现时经济资源</b>（有产生经济利益的潜力）</td></tr>
<tr><td>负债</td><td>liability</td><td>由过去事件产生、企业<b>转移经济资源</b>的<b>现时义务</b></td></tr>
<tr><td>权益</td><td>equity</td><td>资产扣除负债后的<b>剩余权益</b>（residual interest）</td></tr>
<tr><td>收益</td><td>income</td><td>资产增加或负债减少，导致权益增加（不含所有者投入）</td></tr>
<tr><td>费用</td><td>expenses</td><td>资产减少或负债增加，导致权益减少（不含向所有者分配）</td></tr></table>
<p><b>两条恒等式</b>：</p>
<ul><li>时点（资产负债表）：<b>Assets = Liabilities + Equity</b></li>
<li>期间（利润表）：<b>Income − Expenses = Profit</b>，利润最终并进 Equity</li></ul>
<p><b>展开式</b>（把损益也塞进资产负债等式）：<br><b>Assets + Expenses + Drawings = Liabilities + Equity + Income</b></p>
<div class="tip">左边全是「借记增加」，右边全是「贷记增加」——这一条记住，分录就不用背。<br>数字例：赊购设备 £5,000 → 资产 +5,000、负债 +5,000，等式仍平。付现金买耗材 £300 → 资产 −300、费用 +300，等式仍平。</div>`},
 {t:'借贷规则（DEAD CLIC）',tag:'公式',b:`<table><tr><th>借方 Dr 增加</th><th>贷方 Cr 增加</th></tr>
<tr><td><b>D</b>ividends / Drawings</td><td><b>L</b>iabilities</td></tr>
<tr><td><b>E</b>xpenses</td><td><b>I</b>ncome</td></tr>
<tr><td><b>A</b>ssets</td><td><b>C</b>apital / Equity</td></tr></table>
<p><b>四条常用分录（照这个句型写）</b>：</p>
<table><tr><th>交易</th><th>Dr</th><th>Cr</th></tr>
<tr><td>赊购存货 £2,000</td><td>Inventory 2,000</td><td>Trade payables 2,000</td></tr>
<tr><td>现销 £800（成本 500）</td><td>Cash 800 / COGS 500</td><td>Revenue 800 / Inventory 500</td></tr>
<tr><td>计提本月电费 £150 未付</td><td>Electricity expense 150</td><td>Accruals 150</td></tr>
<tr><td>宣告股利 £1,000</td><td>Retained earnings 1,000</td><td>Dividend payable 1,000</td></tr></table>
<div class="warn">ITA 最常错的三处：① 费用与资产的边界（预付是资产，不是费用）；② 累计折旧是资产的<b>减项</b>，不是负债；③ 宣告股利先记负债（Dividend payable），实际付款时才动现金。</div>`},
 {t:'期末调整五大类（ITA 的命门）',tag:'考点',b:`<table><tr><th>类型</th><th>判断</th><th>调整分录</th></tr>
<tr><td>Accrual 应计费用</td><td>已发生未付</td><td>Dr 费用 / Cr 应付款</td></tr>
<tr><td>Prepayment 预付</td><td>已付未用</td><td>先把付出记资产，用掉的部分 Dr 费用 / Cr 预付</td></tr>
<tr><td>Accrued income 应计收入</td><td>已赚未收</td><td>Dr 应收 / Cr 收入</td></tr>
<tr><td>Unearned income 预收</td><td>先收未赚</td><td>Dr 预收 / Cr 收入（实现部分）</td></tr>
<tr><td>Depreciation 折旧</td><td>按期间分摊</td><td>Dr 折旧费用 / Cr 累计折旧</td></tr></table>
<div class="tip">还有两个：Allowance for receivables（坏账准备，Dr 费用 / Cr 准备）与 Closing inventory（Dr 存货 / Cr 销售成本）。</div>`},
 {t:'从试算表到三表的五步流程',tag:'公式',b:`<ol style="padding-left:18px">
<li>抄 TB → 编<b>调整分录</b>（accrual / prepayment / dep / allowance / inventory）</li>
<li>算 <b>COGS = 期初存货 + 采购 − 期末存货</b></li>
<li>把费用按 <b>function</b> 分到 Cost of sales / Distribution / Administrative</li>
<li>得 Profit before tax → 减税 → <b>Profit for the year</b> → 加 OCI = TCI</li>
<li>SOFP：资产按 <b>账面净值</b>（成本 − 累计折旧 − 减值）；权益里的留存收益 = 期初 + 本年利润 − 股利</li></ol>
<div class="warn">平衡检查：<b>总资产 = 总权益 + 总负债</b>。差一点点通常是漏了 allowance、税，或股利没扣留存收益。</div>`},
 {t:'ITA 挂了，通常不是因为不会分录',tag:'考点',b:`<ul>
<li>是<b>期末调整的方向</b>：预付与应计搞反（你之前就踩过 Prepaid / Accrued）</li>
<li>是<b>折旧的"累计"</b>：费用进损益，累计折旧进资产负债表，两者不能混</li>
<li>是<b>税费</b>：税是费用（P&L）也是负债（SOFP），不是从权益直接扣</li>
<li>是<b>试算表不平衡时没有回查</b>：先查总额、再查单笔、最后一笔一笔推</li></ul>
<div class="tip">FAR 比 ITA 多的不是"更难的分录"，是"同一个数字可以有两种合法算法，但只有一种符合 IFRS"。所以每道题先问：这条准则允许我怎么计量？</div>`}
]},
{t:'① Week 1｜Conceptual Framework（一切准则的上位法）',pts:[
 {t:'财务报告的目标与使用者',tag:'考点',b:`<p><b>目标（框架 1.2）</b>：提供对<b>现有和潜在投资者、贷款人及其他债权人</b>作出「是否向企业提供资源」决策有用的财务信息。</p>
<table><tr><th>群体</th><th>为什么排第一</th></tr>
<tr><td><b>投资者</b>（investors）</td><td>要判断未来股利与股价，最关心盈利能力</td></tr>
<tr><td><b>贷款人</b>（lenders）</td><td>要判断本金与利息能否收回，最关心偿债能力</td></tr>
<tr><td><b>其他债权人</b>（other creditors）</td><td>供应商、员工关心短期能否被支付</td></tr></table>
<p>次要使用者：监管机构、员工、客户、公众。他们的需求常与上面三者重叠，所以不再单独列为主要使用者。</p>
<p><b>信息内容三块</b>：① 经济资源与要求权（资产/负债/权益）；② 资源变动（收益/费用）；③ 现金流与融资情况（现金流的金额、时点与不确定性）。</p>
<div class="warn">论述题打分点：先写 <b>decision-useful</b>，再展开「帮助预测未来现金流」（框架 1.3），最后说「不是给管理层做内部决策用的」（那叫 management accounting）。</div>`},
 {t:'两大基本质量特征 + 四个增强特征',tag:'公式',b:`<p><b>基本特征（fundamental）——缺一个信息就不能用</b>：</p>
<table><tr><th>特征</th><th>构成</th><th>例子</th></tr>
<tr><td><b>Relevance 相关性</b></td><td>预测价值（predictive value）、确认价值（confirmatory value）、重要性（materiality）</td><td>存货按 NRV 减记 → 提示未来现金流入下降</td></tr>
<tr><td><b>Faithful representation 如实反映</b></td><td>完整（complete）、中立（neutral）、无重大错误（free from error）</td><td>不隐瞒诉讼或有负债</td></tr></table>
<p><b>增强特征（enhancing）——让有用变更好用</b>：可比性（comparability，含一致性）、可验证性（verifiability）、及时性（timeliness）、可理解性（understandability）。</p>
<p><b>约束条件</b>：成本 &lt; 收益（cost constraint）。</p>
<div class="warn">三个易错：① 相关性与如实反映可能冲突（公允价值更相关，但估值更难核实）；② <b>prudence 审慎</b>是「中立」的一个侧面，不是独立特征；③ 重要性是<b>相关性的一个侧面</b>，不是单独列示的特征。</div>`},
 {t:'五要素的新定义（2018 框架改动点）',tag:'考点',b:`<table><tr><th>要素</th><th>定义</th></tr>
<tr><td><b>Asset</b></td><td>由过去事项产生的、由主体<b>控制</b>的、预期带来经济利益的现时经济资源</td></tr>
<tr><td><b>Liability</b></td><td>由过去事项产生的、主体<b>转移经济资源</b>的现时义务</td></tr>
<tr><td><b>Equity</b></td><td>资产扣除负债后的剩余权益</td></tr>
<tr><td><b>Income</b></td><td>资产增加或负债减少，导致权益增加（非所有者投入）</td></tr>
<tr><td><b>Expense</b></td><td>资产减少或负债增加，导致权益减少（非向所有者分配）</td></tr></table>
<div class="tip">关键词从"预期流入"改成了"<b>控制 + 现时经济资源</b>"，所以"客户合同、使用权资产"这类能被确认为资产。</div>`},
